  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --tx: #f8fafc;
      --mut: #94a3b8;
      --bd: #334155;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --sec-bg: #334155;
      --bad: #ef4444;
      --warn: #f59e0b;
      --warn-bg: #fef3c7;
      --warn-tx: #78350f;
      --ok: #22c55e;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --tx: #0f172a;
      --mut: #64748b;
      --bd: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --sec-bg: #e2e8f0;
      --bad: #dc2626;
      --warn: #d97706;
      --warn-bg: #fef3c7;
      --warn-tx: #78350f;
      --ok: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--tx); padding-bottom: 70px; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--bd); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .logo { height: 32px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
    .container { max-width: 800px; margin: 16px auto; padding: 0 12px; }
    .card { background: var(--card-bg); border: 1px solid var(--bd); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .mut { color: var(--mut); font-size: 0.875rem; }
    .lk { color: var(--primary); text-decoration: none; cursor: pointer; }
    button { background: var(--primary); color: #fff; border: none; padding: 12px 16px; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; width: 100%; margin-top: 8px; }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.sec { background: var(--sec-bg); color: var(--tx); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    label { display: block; font-size: 0.85rem; color: var(--mut); margin-bottom: 4px; font-weight: 500; }
    input, textarea, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--bd); background: var(--bg); color: var(--tx); font-size: 0.95rem; }
    input.low, textarea.low { background-color: var(--warn-bg); color: var(--warn-tx); border-color: var(--warn); }
    textarea { resize: vertical; min-height: 80px; }
    .prev { width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px; margin-top: 12px; border: 1px solid var(--bd); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; background: var(--sec-bg); color: var(--tx); margin-left: 8px; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--bd); display: flex; justify-content: space-around; padding: 8px 0; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
    nav a { text-align: center; color: var(--mut); text-decoration: none; font-size: 0.75rem; flex: 1; cursor: pointer; }
    nav a.on { color: var(--primary); font-weight: bold; }
    nav a b { display: block; font-size: 1.2rem; margin-bottom: 2px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
    .kpi { background: var(--card-bg); border: 1px solid var(--bd); border-radius: 8px; padding: 12px; text-align: center; }
    .kpi b { display: block; font-size: 1.5rem; color: var(--primary); }
    .row { border-bottom: 1px solid var(--bd); padding: 10px 0; }
    .row:last-child { border-bottom: none; }

<body>

<header>
  <div class="logo">🏭 <span>AÇOFORJA</span></div>
  <div id="uinfo" class="mut"></div>
</header>

<main class="container" id="app"></main>

<nav id="nav"></nav>

<script>
// Configurações do Domínio de Dados
const KEYS = ["numero_os", "equipamento", "servico_solicitado", "executante", "tipo_manutencao", "observacoes"];
const LONG = ["servico_solicitado", "observacoes"];
const CAMPOS = [
  ["numero_os", "Nº da Ordem de Serviço"],
  ["equipamento", "Equipamento / TAG"],
  ["servico_solicitado", "Serviço Solicitado / Descrição"],
  ["executante", "Executante / Responsável"],
  ["tipo_manutencao", "Tipo de Manutenção"],
  ["observacoes", "Observações / Causa Raiz"]
];

let tab = "nova", draft = null, photo = null, editId = null, msg = "", loginMsg = "", busy = false, ia = false, rec = [];

const $ = sel => document.querySelector(sel);
const esc = str => String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const setMsg = txt => { msg = txt; const el = $("#msg"); if (el) el.textContent = txt; };
const setCampo = (k, v) => { if (!draft) draft = {}; draft[k] = v; };

function limparNumeroOS(val) {
  return String(val || "").replace(/[^a-zA-Z0-9\-/]/g, "").toUpperCase();
}

function normalizarDados(d) {
  const o = {};
  KEYS.forEach(k => o[k] = String(d?.[k] ?? "").trim());
  o.numero_os = limparNumeroOS(o.numero_os);
  o.ocr_texto = String(d?.transcricao || "").trim();
  let inc = Array.isArray(d?.incertos) ? d.incertos.filter(k => KEYS.includes(k)) : [];
  if (o.ocr_texto) {
    const alt = extrairCamposOCR(o.ocr_texto);
    KEYS.forEach(k => { if (!o[k] && alt[k]) { o[k] = alt[k]; if (!inc.includes(k)) inc.push(k); } });
  }
  KEYS.forEach(k => { if (!o[k] && !inc.includes(k)) inc.push(k); });
  o.incertos = inc;
  o.origem = "gemini";
  return o;
}

// Manipulação e Otimização de Imagens
async function carregarBitmap(file) {
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch (e) {}
  }
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(u); res(img); };
    img.onerror = rej;
    img.src = u;
  });
}

async function reduzir(file, max = 2000) {
  const img = await carregarBitmap(file);
  const w0 = img.width || img.naturalWidth, h0 = img.height || img.naturalHeight;
  const k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement("canvas");
  c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0, c.width, c.height);
  if (img.close) try { img.close(); } catch (e) {}
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("Falha ao processar imagem")), "image/jpeg", 0.9));
}

async function prepararParaOCR(blob) {
  const img = await carregarBitmap(blob);
  const c = document.createElement("canvas");
  c.width = img.width || img.naturalWidth; c.height = img.height || img.naturalHeight;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(img, 0, 0);
  if (img.close) try { img.close(); } catch (e) {}
  const im = g.getImageData(0, 0, c.width, c.height), d = im.data, hist = new Uint32Array(256);
  for (let i = 0; i < d.length; i += 4) {
    const y = Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
    d[i] = d[i + 1] = d[i + 2] = y; hist[y]++;
  }
  const tot = c.width * c.height; let acc = 0, lo = 0, hi = 255;
  for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc >= tot * 0.01) { lo = i; break; } }
  acc = 0; for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc >= tot * 0.01) { hi = i; break; } }
  const span = Math.max(1, hi - lo);
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.max(0, Math.min(255, (d[i] - lo) * 255 / span));
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  g.putImageData(im, 0, 0);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("Falha no preparo do OCR")), "image/png"));
}

// Motor de OCR Local (Tesseract)
let ocrWorker = null;
async function obterOCRWorker() {
  if (ocrWorker) return ocrWorker;
  ocrWorker = await Tesseract.createWorker("por", 1, {
    logger: m => { if (m && typeof m.progress === "number") setMsg("🔎 OCR local processando... " + Math.round(m.progress * 100) + "%"); }
  });
  try { await ocrWorker.setParameters({ tessedit_pageseg_mode: "6", preserve_interword_spaces: "1" }); } catch (e) {}
  return ocrWorker;
}

function normalizarOCR(t) {
  return (t || "").replace(/\r/g, "").replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
}

async function ocrLocal(blob) {
  const worker = await obterOCRWorker();
  let alvo = blob;
  try { alvo = await prepararParaOCR(blob); } catch (e) { console.warn("Sem pré-processamento", e); }
  const result = await worker.recognize(alvo);
  const texto = normalizarOCR(result?.data?.text || "");
  if (!texto) throw new Error("Não foi encontrado texto legível na imagem");
  return texto;
}

const semAcento = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const ROTULOS = {
  numero_os: ["no ordem de servico", "n ordem de servico", "ordem de servico", "numero da ordem", "n da ordem", "numero da os", "numero os", "n os", "os n"],
  equipamento: ["tag equipamento", "tag do equipamento", "equipamento", "maquina", "tag"],
  servico_solicitado: ["problema detectado", "servico solicitado", "descricao do servico", "servico a executar", "defeito apresentado", "solicitacao"],
  executante: ["executante", "executado por", "responsavel pela execucao", "responsavel", "mecanico", "tecnico"],
  tipo_manutencao: ["tipo de manutencao", "tipo manutencao", "manutencao"],
  observacoes: ["observacoes", "observacao", "obs.", "servico realizado", "causa raiz"]
};

function acharRotulo(linha) {
  const l = semAcento(linha).replace(/[°º]/g, "o");
  let melhor = null;
  for (const k of KEYS) {
    for (const r of ROTULOS[k]) {
      const i = l.indexOf(r);
      if (i < 0 || i > 30) continue;
      const fim = i + r.length, prox = l[fim] || " ";
      if (/[a-z0-9]/.test(prox)) continue;
      if (!melhor || r.length > melhor.len) melhor = { k, len: r.length, fim };
    }
  }
  return melhor;
}

function extrairCamposOCR(texto) {
  const t = normalizarOCR(texto);
  const linhas = t.split("\n").map(x => x.trim()).filter(Boolean);
  const dados = {}; KEYS.forEach(k => dados[k] = "");
  const marcas = linhas.map(acharRotulo);
  for (let i = 0; i < linhas.length; i++) {
    const m = marcas[i]; if (!m || (dados[m.k] && m.k !== "observacoes")) continue;
    let resto = linhas[i].slice(m.fim).replace(/^[\s:;\-–—.#]+/, "").trim();
    const partes = resto ? [resto] : [];
    const maxLinhas = LONG.includes(m.k) ? 6 : (resto ? 0 : 1);
    for (let j = i + 1; j < linhas.length && partes.length < (resto ? 1 + maxLinhas : maxLinhas); j++) {
      if (marcas[j]) break;
      partes.push(linhas[j]);
    }
    const txt = partes.join(" ").trim();
    if (m.k === "observacoes") {
      const rot = linhas[i].slice(0, m.fim).trim();
      const rl = rot.toLowerCase(), pref = /^obs/.test(semAcento(rl)) ? "" : rl.charAt(0).toUpperCase() + rl.slice(1) + ": ";
      if (txt) dados.observacoes = (dados.observacoes ? dados.observacoes + "\n" : "") + pref + txt;
    } else dados[m.k] = txt;
  }
  if (!dados.numero_os) {
    const m = t.match(/(?:\bO\.?\s?S\.?|ORDEM(?:\s+DE\s+SERVI[ÇC]O)?)\s*(?:N[º°o.]*)?\s*[:#\-]?\s*([A-Z]{0,3}[-/]?\d{2,}[A-Z0-9\-/]*)/i);
    if (m) dados.numero_os = m[1];
  }
  dados.numero_os = limparNumeroOS(dados.numero_os);
  return { ...dados, incertos: KEYS.filter(k => !dados[k]), ocr_texto: t, origem: "ocr" };
}

// Fluxos de Execução da IA / OCR
async function processarOCR(somenteLocal) {
  if (busy) return;
  if (!photo) { msg = "📷 Tire uma foto ou selecione um arquivo da galeria primeiro."; render(); return; }
  busy = true; render();
  let erroIA = "";
  try {
    if (ia && Core.can("usar_ia") && !somenteLocal) {
      try {
        setMsg("🤖 Gemini analisando a imagem da OS...");
        draft = await lerComGemini(photo.blob);
        const n = draft.incertos.length;
        msg = "✅ Leitura concluída (" + (typeof modeloUsado !== "undefined" ? modeloUsado : "Gemini") + ")." + (n ? " ⚠️ Revise os campos em amarelo." : " Confirme os dados abaixo.");
        return;
      } catch (e) { console.error(e); erroIA = e.message || "Falha de conexão com IA"; }
    }
    setMsg("🔎 Processando via OCR local...");
    const texto = await ocrLocal(photo.blob);
    draft = extrairCamposOCR(texto);
    if (erroIA) msg = "⚠️ Gemini indisponível (" + erroIA + "). Leitura feita via OCR local.";
    else if (!ia && !somenteLocal) msg = "✅ OCR local concluído. Ative a chave da IA no Painel Admin para melhor precisão.";
    else msg = "✅ OCR local concluído. Verifique os campos.";
  } catch (e) {
    console.error(e);
    msg = "❌ Não foi possível ler a imagem: " + (e.message || "Erro desconhecido") + ". Preencha manualmente.";
  } finally {
    busy = false; render();
  }
}

const processarOCRSomente = () => processarOCR(true);

async function salvar() {
  if (!editId && !Core.can("criar_os")) { msg = "Sem permissão para cadastrar OS."; render(); return; }
  if (editId && !Core.can("editar_os")) { msg = "Sem permissão para editar OS."; render(); return; }
  rec = Core.regs();
  const u = Core.usuario();
  const ex = editId ? rec.find(x => x.id === editId) : null;
  const o = ex ? { ...ex } : { id: "os_" + Date.now(), criado: new Date().toISOString(), usuario: u ? u.nome : "", usuario_id: u ? u.id : "" };
  CAMPOS.forEach(([k]) => { const v = $("#f_" + k).value.trim(); o[k] = v || ""; });
  if (!o.numero_os && !o.equipamento) { msg = "Preencha ao menos o Número da OS ou o Equipamento."; render(); return; }
  if (photo) { await fotoPut(o.id, photo.blob); o.foto = true; } else if (!ex) o.foto = false;
  if (ex) { o.editado = new Date().toISOString(); o.editado_por = u ? u.nome : ""; rec[rec.findIndex(x => x.id === ex.id)] = o; } else rec.unshift(o);
  salvarRegs();
  const foiEdicao = !!ex; editId = null; draft = null; photo = null;
  msg = foiEdicao ? "✅ OS atualizada com sucesso!" : "✅ OS salva no histórico!"; tab = "hist"; render();
}

async function exportar() {
  if (!Core.can("exportar")) { msg = "Sem permissão para exportar."; render(); return; }
  const lista = visiveis();
  if (!lista.length) { msg = "Sem dados para exportar."; render(); return; }
  const ws = XLSX.utils.json_to_sheet(lista.map(r => { const x = {}; CAMPOS.forEach(([k, l]) => x[l] = r[k] || ""); x["Registrado por"] = r.usuario || ""; x["Registrado em"] = r.criado; return x; }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "OS");
  XLSX.writeFile(wb, "historico_os.xlsx");
}

async function perguntar() {
  const q = $("#q").value.trim(); if (!q || !ia || !Core.can("consultar_ia")) return; busy = true; if ($("#resp")) $("#resp").textContent = "Analisando histórico...";
  const base = visiveis().map(({ foto, id, criado, ...r }) => r);
  const p = `Você é assistente técnico de manutenção. Use APENAS o histórico abaixo. Responda em português e de forma objetiva.\nHISTÓRICO:\n${JSON.stringify(base)}\n\nPERGUNTA: ${q}`;
  try { ia_resp = await gem([{ type: "text", text: p }]); } catch (e) { ia_resp = "Erro na consulta (" + (e.message || "falha") + ")."; }
  busy = false; render();
}
let ia_resp = "";

// Componentes da Interface (Telas)
function telaNova() {
  if (!Core.can("criar_os") && !editId) return `<div class="card"><b>Nova Ordem de Serviço</b><div class="mut">Acesso não permitido. Contate o administrador.</div></div>`;
  const inc = draft?.incertos || [];
  const dados = draft || {};
  const origem = dados.origem === "gemini" ? "Gemini IA" : dados.origem === "ocr" ? "OCR Local" : "";
  return `<div class="card">
    <b>${editId ? "Editar Ordem de Serviço" : "Nova Ordem de Serviço"}</b>
    <div class="mut" id="msg">${esc(msg || "Tire uma foto para preenchimento automático ou preencha manualmente.")}</div>

    <input type="file" id="cam" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="gal" accept="image/*" style="display:none">

    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button type="button" style="flex:1" onclick="$('#cam').click()">📷 TIRAR FOTO</button>
      <button type="button" class="sec" style="flex:1" onclick="$('#gal').click()">🖼️ GALERIA</button>
    </div>
    
    ${photo ? `<img class="prev" src="${photo.url}" alt="OS"><button type="button" ${busy ? "disabled" : ""} onclick="processarOCR()">${busy ? "⏳ PROCESSANDO..." : "🤖 LER E PREENCHER AUTOMATICAMENTE"}</button>${!busy ? `<button type="button" class="sec" onclick="processarOCRSomente()">🔎 Usar apenas OCR local</button>` : ""}` : ""}

    <hr style="border:0;border-top:1px solid var(--bd);margin:16px 0">

    <b>Dados da Ordem</b>${origem ? `<span class="badge">Lido via ${origem}</span>` : ""}
    <div class="grid">
      ${CAMPOS.map(([k, l]) => `
        <div style="${LONG.includes(k) ? "grid-column:1/-1" : ""}">
          <label>${l}${inc.includes(k) ? " ⚠️ Revisar" : ""}</label>
          ${LONG.includes(k)
            ? `<textarea id="f_${k}" class="${inc.includes(k) ? "low" : ""}" placeholder="${l}" oninput="setCampo('${k}',this.value)">${esc(dados[k] || "")}</textarea>`
            : `<input id="f_${k}" class="${inc.includes(k) ? "low" : ""}" value="${esc(dados[k] || "")}" placeholder="${l}" oninput="setCampo('${k}',this.value)">`
          }
        </div>`).join("")}
    </div>
    ${dados.ocr_texto ? `<details style="margin-top:8px"><summary class="mut">Ver transcrição completa</summary><pre class="mut" style="white-space:pre-wrap">${esc(dados.ocr_texto)}</pre></details>` : ""}

    <button type="button" style="margin-top:16px" onclick="salvar()">✅ SALVAR ORDEM DE SERVIÇO</button>
    ${draft || photo || editId ? `<button type="button" class="sec" onclick="draft=null;photo=null;editId=null;msg='';render()">Limpar Formulário</button>` : ""}
  </div>`;
}

function telaPesq() {
  const t = ($("#busca")?.value || window._b || "").toLowerCase(); window._b = t;
  const r = t ? visiveis().filter(x => JSON.stringify(x).toLowerCase().includes(t)) : [];
  return `<div class="card"><b>🔎 Consultar Registros</b><input id="busca" style="margin-top:8px" placeholder="Buscar por OS, equipamento, serviço..." value="${esc(t)}" oninput="window._b=this.value;render(true)">
  <div style="margin-top:12px">${t ? (r.length ? r.map(linha).join("") : `<p class="mut">Nenhum registro encontrado.</p>`) : `<p class="mut">Digite um termo para pesquisar.</p>`}</div></div>`;
}

function visiveis() {
  if (Core.aberto() || Core.can("ver_historico")) return rec;
  const u = Core.usuario(); return rec.filter(r => u && r.usuario_id === u.id);
}

function telaCompat() {
  const u = Core.usuario();
  const perms = Core.PERMS.filter(([k]) => Core.can(k)).map(([, l]) => l);
  return `<div class="card"><b>👤 Informações do Usuário</b>
  ${u ? `<div class="mut" style="margin-top:8px">Usuário: <b>${esc(u.nome)}</b><br>Cargo: <b>${esc(u.cargo)}</b> (Nível ${u.nivel})</div>
  <button type="button" class="sec" style="margin-top:12px" onclick="sair()">Sair da Conta</button>` : `<div class="mut" style="margin-top:8px">Acesso sem login ativo. Configure administradores no <a class="lk" href="admin.html">Painel Admin</a>.</div>`}
  <div class="mut" style="margin-top:12px">Status IA: ${ia ? "🟢 Ativa" : "🔴 Inativa"}</div>
  ${u ? `<div class="mut" style="margin-top:4px">Permissões: ${esc(perms.join(" • ") || "Nenhuma")}</div>` : ""}
  </div>
  ${ia && Core.can("consultar_ia") ? `<div class="card"><b>💬 Assistente Virtual do Histórico</b>
  <textarea id="q" placeholder="Ex.: Quantas manutenções foram feitas na prensa essa semana?">${esc(window._q || "")}</textarea>
  <button ${busy ? "disabled" : ""} onclick="window._q=$('#q').value;perguntar()">Enviar Pergunta</button>
  <pre id="resp" class="mut" style="margin-top:12px;white-space:pre-wrap">${esc(ia_resp)}</pre></div>` : ""}`;
}

function telaLogin() {
  const us = Core.users().filter(u => u.ativo);
  return `<div class="card"><b>🔐 Acesso ao Sistema</b>
   <label style="margin-top:8px">Selecione seu usuário</label>
   <select id="l_user">${us.map(u => `<option value="${u.id}">${esc(u.nome)} —${esc(u.cargo)}</option>`).join("")}</select>
   <label style="margin-top:8px">PIN de Segurança</label>
   <input id="l_pin" type="password" inputmode="numeric" maxlength="8" onkeydown="if(event.key==='Enter')entrarApp()">
   ${loginMsg ? `<div class="mut" style="color:var(--bad);margin-top:8px">${esc(loginMsg)}</div>` : ""}
   <button type="button" style="margin-top:12px" onclick="entrarApp()">Entrar</button></div>`;
}

async function entrarApp() {
  const r = await Core.login($("#l_user")?.value, $("#l_pin")?.value || "");
  loginMsg = r.ok ? "" : r.erro; if (r.ok) { msg = ""; tab = "nova"; } render();
}

function sair() { Core.logout(); draft = null; photo = null; editId = null; msg = ""; loginMsg = ""; render(); }

function atualizarHeader() {
  const el = $("#uinfo"), u = Core.usuario(); if (!el) return;
  el.innerHTML = u ? `<b>${esc(u.nome)}</b> (${esc(u.cargo)})${Core.can("painel_admin") ? ` · <a class="lk" href="admin.html">⚙️ Admin</a>` : ""} · <a class="lk" onclick="sair()">Sair</a>` : "";
}

function linha(r) {
  return `<div class="row">
    <b>OS Nº ${esc(r.numero_os || "S/N")}</b> — ${esc(r.equipamento || "Sem TAG")}
    <div class="mut"><b>Serviço:</b> ${esc(r.servico_solicitado || "—")}</div>
    <div class="mut"><b>Executante:</b> ${esc(r.executante || "—")} | <b>Tipo:</b> ${esc(r.tipo_manutencao || "—")}</div>
    ${r.observacoes ? `<div class="mut"><b>Obs:</b> ${esc(r.observacoes)}</div>` : ""}
    <div style="display:flex;gap:8px;margin-top:6px">
      ${r.foto ? `<button class="sec" style="width:auto;padding:4px 8px;font-size:0.8rem" onclick="ver('${r.id}')">📎 Foto</button>` : ""}
      ${Core.can("editar_os") ? `<button class="sec" style="width:auto;padding:4px 8px;font-size:0.8rem" onclick="editar('${r.id}')">✏️ Editar</button>` : ""}
      ${Core.can("excluir_os") ? `<button class="sec" style="width:auto;padding:4px 8px;font-size:0.8rem;color:var(--bad)" onclick="apagar('${r.id}')">Excluir</button>` : ""}
    </div>
    <div id="v_${r.id}"></div>
  </div>`;
}

function telaHist() {
  const list = visiveis();
  return `<div class="card"><b>📊 Histórico de Ordens (${list.length})</b>
  <div class="mut" style="margin-top:4px">${esc(msg)}</div>
  <div style="margin-top:12px">${list.map(linha).join("") || `<p class="mut">Nenhuma Ordem de Serviço cadastrada.</p>`}</div>
  ${Core.can("exportar") ? `<button style="margin-top:16px" onclick="exportar()">⬇️ Exportar Excel (.xlsx)</button>` : ""}</div>`;
}

function telaDash() {
  const list = visiveis();
  const uniq = k => new Set(list.map(r => (r[k] || "").trim().toLowerCase()).filter(Boolean)).size;
  const top = k => {
    const m = {}; list.forEach(r => { const v = (r[k] || "").trim(); if (v) m[v] = (m[v] || 0) + 1; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 5);
  };
  const renderBloco = (t, k) => `<div class="card"><b>${t}</b><div style="margin-top:8px">${top(k).map(([n, c]) => `<div class="row" style="display:flex;justify-content:space-between"><span>${esc(n)}</span><b>${c} OS</b></div>`).join("") || `<p class="mut">—</p>`}</div></div>`;
  return `<div class="kpis">
    <div class="kpi"><b>${list.length}</b>Total de OS</div>
    <div class="kpi"><b>${uniq("equipamento")}</b>Equipamentos</div>
    <div class="kpi"><b>${uniq("executante")}</b>Executantes</div>
  </div>
  <div style="margin-top:12px">${renderBloco("Equipamentos Frequentes", "equipamento")}${renderBloco("Tipos de Manutenção", "tipo_manutencao")}${renderBloco("Principais Executantes", "executante")}</div>`;
}

async function ver(id) {
  const el = $("#v_" + id); if (el.innerHTML) { el.innerHTML = ""; return; }
  const b = await fotoGet(id); el.innerHTML = b ? `<img class="prev" src="${URL.createObjectURL(b)}">` : `<div class="mut">Imagem não encontrada.</div>`;
}

async function apagar(id) {
  if (!Core.can("excluir_os") || !confirm("Deseja realmente excluir esta OS?")) return;
  rec = Core.regs().filter(r => r.id !== id); await fotoDel(id); salvarRegs(); render();
}

function editar(id) {
  if (!Core.can("editar_os")) return;
  const r = Core.regs().find(x => x.id === id); if (!r) return;
  editId = id; draft = { ...r, incertos: [], origem: "" }; photo = null; tab = "nova";
  msg = "✏️ Editando OS " + (r.numero_os || "S/N"); render();
}

const TABS_ALL = [["nova", "📷", "Nova OS", "criar_os"], ["pesq", "🔎", "Buscar", "pesquisar"], ["hist", "📊", "Histórico", null], ["dash", "📈", "Painel", "dashboard"], ["compat", "👤", "Conta", null]];
function tabsVisiveis() { return TABS_ALL.filter(t => !t[3] || Core.can(t[3]) || (t[0] === "nova" && editId)).map(t => [t[0], t[1], t[2]]); }

async function tratarArquivos(files) {
  const lista = Array.from(files || []).filter(f => f.type && f.type.startsWith("image/"));
  if (!lista.length) return;
  try {
    setMsg("📷 Carregando foto...");
    const blob = await reduzir(lista[0]);
    if (photo?.url) try { URL.revokeObjectURL(photo.url); } catch (x) {}
    photo = { blob, url: URL.createObjectURL(blob), nome: lista[0].name };
    msg = "✅ Foto pronta! Clique abaixo para realizar a leitura."; render();
  } catch (x) {
    console.error(x); msg = "❌ Não foi possível carregar a imagem."; render();
  }
}

function render(keep) {
  const a = $("#app"), foc = document.activeElement?.id, pos = document.activeElement?.selectionStart;
  ia = !!getKey(); rec = Core.regs(); atualizarHeader();
  if (Core.exigeLogin()) { a.innerHTML = telaLogin(); $("#nav").innerHTML = ""; return; }
  const TV = tabsVisiveis(); if (!TV.some(t => t[0] === tab)) tab = TV[0][0];
  a.innerHTML = { nova: telaNova, pesq: telaPesq, compat: telaCompat, hist: telaHist, dash: telaDash }[tab]();
  $("#nav").innerHTML = TV.map(([k, i, l]) => `<a class="${k === tab ? "on" : ""}" onclick="tab='${k}';msg='';render()"><b>${i}</b>${l}</a>`).join("");
  const c = $("#cam"), g = $("#gal");
  if (c) c.onchange = async e => { await tratarArquivos(e.target.files); c.value = ""; };
  if (g) g.onchange = async e => { await tratarArquivos(e.target.files); g.value = ""; };
  if (keep && foc) { const e = document.getElementById(foc); if (e) { e.focus(); try { e.setSelectionRange(pos, pos); } catch (x) {} } }
}

render();
if (typeof aplicarTema !== "undefined" && typeof temaAtual !== "undefined") {
  aplicarTema(temaAtual());
}
</script>
</body>
</html>
