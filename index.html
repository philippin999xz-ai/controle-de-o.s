<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Gestão Inteligente de OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="core.js"></script>
<style>
:root{--bg:#000;--card:#0e0e0e;--tx:#fff;--mut:#a6a6a6;--pri:#ffff00;--onpri:#000;--pribg:rgba(255,255,0,.14);--navbg:#000;--bd:#3d3d3d;--line:#b7b7b7;--warn:#ff9800;--ok:#00b050;--bad:#ff0000;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f2f2f2;--card:#fff;--tx:#000;--mut:#5c5c5c;--pri:#000;--onpri:#ffff00;--pribg:rgba(0,0,0,.08);--navbg:#fff;--bd:#d0d0d0;--line:#000;--warn:#e65100;--bad:#d50000;color-scheme:light}
:root[data-theme="light"] header img{filter:invert(1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px}
header{padding:14px 16px 12px;font-weight:700;font-size:17px;border-bottom:1px solid var(--line);margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:34px;width:auto;display:block}
header .t{flex:1;min-width:180px}
button.tema{width:auto;margin:0;padding:8px 12px;background:transparent;color:var(--tx);border:1px solid var(--line);font-size:16px;line-height:1}
header small{display:block;font-weight:400;color:var(--mut);font-size:12px}
main{max-width:720px;margin:0 auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:var(--pri);color:var(--onpri);font-weight:600;width:100%;margin-top:8px}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.del{background:var(--bad);color:#fff}
button:disabled{opacity:.5}
label{display:block;font-size:12px;color:var(--mut);margin-top:10px}
input,textarea{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
textarea{min-height:70px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--navbg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:10px 0;font-size:11px;color:var(--mut)}
nav a.on{color:var(--pri);font-weight:700}
nav a b{display:block;font-size:20px}
img.prev{width:100%;border-radius:10px;margin-top:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.kpi b{display:block;font-size:26px;color:var(--pri)}
.row{border-bottom:1px solid var(--bd);padding:10px 0}
.row:last-child{border:0}
.mut{color:var(--mut);font-size:13px}
pre{white-space:pre-wrap;font:inherit;margin:8px 0 0}
.low{border-color:var(--warn);background:rgba(255,152,0,.14)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--pribg);color:var(--pri);margin-left:6px;vertical-align:middle}
details{margin-top:10px}
details summary{color:var(--pri);font-size:13px;cursor:pointer}
details pre{font-size:12px;color:var(--mut);max-height:240px;overflow:auto;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
header a.lk,.lk{color:var(--pri);font-size:12px;text-decoration:underline;margin-left:8px;cursor:pointer}
.err{color:var(--bad);font-size:13px;margin-top:8px}
</style>
</head>

<script>
// ---- tema claro/escuro (padrão: escuro; escolha salva neste aparelho) ----
function aplicarTema(t){
  document.documentElement.setAttribute("data-theme",t);
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="light"?"#ffffff":"#000000";
  const b=document.getElementById("tema");if(b){b.textContent=t==="light"?"🌙":"☀️";b.title=t==="light"?"Mudar para tema escuro":"Mudar para tema claro"}
}
function temaAtual(){return document.documentElement.getAttribute("data-theme")==="light"?"light":"dark"}
function alternarTema(){
  const n=temaAtual()==="light"?"dark":"light";
  try{localStorage.setItem("os_tema",n)}catch(e){}
  aplicarTema(n);
}
(function(){let t="dark";try{t=localStorage.getItem("os_tema")==="light"?"light":"dark"}catch(e){}aplicarTema(t)})();
const CAMPOS=[["numero_os","Número da Ordem"],["equipamento","Equipamento"],["servico_solicitado","Serviço solicitado"],["executante","Executante"],["tipo_manutencao","Tipo de manutenção"],["observacoes","Observação"]];
const LONG=["servico_solicitado","observacoes"];
const KEYS=CAMPOS.map(c=>c[0]);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tab="nova", rec=[], draft=null, photo=null, msg="", busy=false, ia=false, editId=null, loginMsg="";

// atualiza só a mensagem, sem refazer a tela (não apaga o que foi digitado)
function setMsg(t){msg=t;const e=$("#msg");if(e)e.textContent=t}
// guarda o que a pessoa digita nos campos
function setCampo(k,v){if(!draft)draft={incertos:[]};draft[k]=v}

// ---- armazenamento (registros em localStorage, fotos em IndexedDB) ----
rec=Core.regs();
const salvarRegs=()=>{if(!Core.saveRegs(rec))msg="Falha ao salvar localmente."};
let db=null;
const dbReady=new Promise(r=>{try{const q=indexedDB.open("os_fotos",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const fotoPut=async(id,b)=>{await dbReady;if(!db)return;return new Promise(r=>{try{const t=db.transaction("f","readwrite");t.objectStore("f").put(b,id);t.oncomplete=r;t.onerror=r}catch(e){r()}})};
const fotoGet=async id=>{await dbReady;if(!db)return null;return new Promise(r=>{try{const q=db.transaction("f").objectStore("f").get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})};
const fotoDel=async id=>{await dbReady;if(!db)return;try{db.transaction("f","readwrite").objectStore("f").delete(id)}catch(e){}};

// =====================================================================
//  GEMINI (Interactions API) — a foto vai DIRETO para o modelo
// =====================================================================
// Se o primeiro modelo não existir/estiver sobrecarregado, tenta o próximo.
const MODELOS=["gemini-3.8-flash","gemini-3.5-flash"];
const API_URL="https://generativelanguage.googleapis.com/v1beta/interactions";
let modeloUsado="";
const getKey=()=>{try{return localStorage.getItem("gem_key")||""}catch(e){return ""}};
const espera=ms=>new Promise(r=>setTimeout(r,ms));

// Extrai o texto da resposta em qualquer formato (steps novo, outputs legado, candidates)
function extrairTextoResposta(j){
  if(typeof j?.output_text==="string"&&j.output_text.trim())return j.output_text;
  const out=[];
  const add=c=>{
    if(!c)return;
    if(typeof c==="string"){out.push(c);return}
    if(Array.isArray(c)){c.forEach(add);return}
    if(typeof c.text==="string"&&(!c.type||c.type==="text"))out.push(c.text);
    if(c.content)add(c.content);
    if(c.parts)add(c.parts);
  };
  for(const s of (j?.steps||[])){if(s.type==="model_output")add(s.content)}
  if(!out.length)for(const o of (j?.outputs||[]))add(o);
  if(!out.length)for(const cd of (j?.candidates||[]))add(cd.content?.parts);
  return out.join("\n").trim();
}

async function gem(input,schema){
  const key=getKey();
  if(!key)throw new Error("Chave da API não configurada");
  let ultimoErro=null;
  for(const model of MODELOS){
    for(let tentativa=0;tentativa<2;tentativa++){
      const ctl=new AbortController();
      const to=setTimeout(()=>ctl.abort(),90000);
      let tentarDeNovo=false;
      try{
        const body={model,input};
        if(schema)body.response_format={type:"text",mime_type:"application/json",schema};
        const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify(body),signal:ctl.signal});
        let j={};try{j=await r.json()}catch(e){}
        if(r.ok){
          const t=extrairTextoResposta(j);
          if(!t){ultimoErro=new Error("O Gemini respondeu sem texto (status: "+(j.status||"?")+", modelo "+model+")");break}
          modeloUsado=model;
          return t;
        }
        const det=(j?.error?.message||("HTTP "+r.status))+" [HTTP "+r.status+" · "+model+"]";
        const err=new Error(det);
        // 400/401/403 = problema de chave ou de requisição: não adianta tentar outro modelo
        if([400,401,403].includes(r.status)){err.fatal=true;throw err}
        ultimoErro=err;
        if((r.status===429||r.status>=500)&&tentativa===0)tentarDeNovo=true;
      }catch(e){
        if(e.fatal)throw e;
        ultimoErro=e.name==="AbortError"?new Error("Tempo esgotado esperando o Gemini ("+model+")"):new Error((e.message||"Falha de rede")+" ("+model+")");
        if(tentativa===0)tentarDeNovo=true;
      }finally{clearTimeout(to)}
      if(tentarDeNovo){await espera(1500);continue}
      break;
    }
  }
  throw ultimoErro||new Error("Falha ao consultar o Gemini");
}

function parseJSONSeguro(t){
  const limpo=String(t||"").replace(/```json/gi,"").replace(/```/g,"").trim();
  try{return JSON.parse(limpo)}catch(e){}
  const a=limpo.indexOf("{"),b=limpo.lastIndexOf("}");
  if(a>=0&&b>a)return JSON.parse(limpo.slice(a,b+1));
  throw new Error("A resposta do Gemini não veio em JSON");
}

const b64=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(",")[1]);f.onerror=rej;f.readAsDataURL(b)});

// ---- prompt + schema da leitura da OS ----
const PROMPT_OS=`Você é um especialista em leitura de Ordens de Serviço (O.S.) da AÇOFORJA, emitidas pelo sistema Engeman, em manutenção industrial. A imagem é uma FOTO de celular de uma O.S., geralmente com letra manuscrita. Leia a imagem diretamente e preencha os campos.

SOBRE AS FOTOS:
- Podem aparecer VÁRIAS folhas empilhadas ou sobrepostas, além de mesa, mãos, canetas, fita e adesivos coloridos (bolinhas vermelhas, azuis, amarelas). Leia SOMENTE a folha da frente (a mais inteira, completa e em primeiro plano). Ignore as folhas de trás, mesmo que apareça texto delas. Adesivos são só marcações, não são texto.
- Existem dois modelos de folha:
  MODELO A (formulário preenchido à mão): quadros "Nº ORDEM DE SERVIÇO", "TAG EQUIPAMENTO", "TIPO DE MANUTENÇÃO" (ex.: CORRETIVA), "SETOR EXECUTANTE", "APROPRIAÇÃO DE HORAS" com coluna "Executante", "PROBLEMA DETECTADO", "SERVIÇO REALIZADO", "CAUSA RAIZ", "REQUER AÇÃO POSTERIOR" e "MANUTENTOR RESPONSÁVEL PELA LIBERAÇÃO".
  MODELO B (impressão do Engeman): "Ordem de Serviço", "Data Programada", "Equipamento", "Setor Executante", "Tipo de Manutenção" (ex.: MA-CO - MANUTENÇÃO CORRETIVA), "Serviço Solicitado", "Observações" e tabela "Executante".

PASSO 1 — "transcricao":
Transcreva fielmente o texto da folha da frente, linha a linha, na ordem em que aparece (rótulos impressos e texto manuscrito). Escreva [ilegível] onde não der para ler. Faça isso ANTES de preencher os campos.

PASSO 2 — campos:
- numero_os: número do quadro "Nº ORDEM DE SERVIÇO" (modelo A) ou "Ordem de Serviço" (modelo B). Costuma ter 6 dígitos e começar com 89 (ex.: 892366). Devolva só o número. NÃO confunda com data (ex.: 14/09/26), horário, "Data Programada", "Emitido em" ou código do equipamento. Se algum dígito manuscrito for duvidoso (1/7, 4/9, 6/0, 2/3), faça a melhor leitura e inclua o campo em "incertos".
- equipamento: TAG do equipamento. Modelo A: quadro "TAG EQUIPAMENTO", normalmente manuscrito (ex.: M60, PR-14, MCN01). Modelo B: campo "Equipamento" (código + descrição, ex.: PROESP/U - PROCESSOS ESPECIAIS/USINAGEM). Em letras ambíguas (O/0, I/1) faça a melhor leitura e marque em "incertos".
- servico_solicitado: modelo A: texto do quadro "PROBLEMA DETECTADO". Modelo B: texto do campo "Serviço Solicitado".
- executante: modelo A: nomes manuscritos na coluna "Executante" da tabela "APROPRIAÇÃO DE HORAS" (vários nomes separados por vírgula); se a coluna estiver vazia, use o nome de "MANUTENTOR RESPONSÁVEL PELA LIBERAÇÃO". Modelo B: nomes da tabela "Executante"; se estiver vazia, "". NÃO use o nome do Solicitante/Funcionário.
- tipo_manutencao: uma palavra padronizada: Corretiva, Preventiva, Preditiva ou Melhoria (ex.: "MA-CO - MANUTENÇÃO CORRETIVA" vira "Corretiva"). Se estiver tapado ou ilegível, "".
- observacoes: modelo A: junte em linhas separadas "Serviço realizado: ...", "Causa raiz: ..." e "Ação posterior: ..." (só as que estiverem preenchidas). Modelo B: texto do campo "Observações". Se vazio, "".

REGRAS:
1. Use somente o que está na imagem. Não invente, não complete e não suponha.
2. Campo ausente ou ilegível = "" e inclua o nome do campo em "incertos".
3. Na letra manuscrita, faça a melhor leitura e marque em "incertos" o campo em que tiver dúvida real.
4. Preserve números, códigos, nomes e acentuação como estão escritos (corrija apenas erros óbvios de leitura). Não traduza.
5. Não crie campos novos.`;

const SCHEMA_OS={
  type:"object",
  properties:{
    transcricao:{type:"string",description:"Transcrição fiel de todo o texto visível na foto, linha a linha."},
    numero_os:{type:"string",description:"Número ou código da ordem, exatamente como impresso/escrito."},
    equipamento:{type:"string",description:"Equipamento ou máquina, com código/TAG se houver."},
    servico_solicitado:{type:"string",description:"Descrição completa do serviço solicitado."},
    executante:{type:"string",description:"Executante ou responsável pelo serviço."},
    tipo_manutencao:{type:"string",description:"Tipo de manutenção; somente a opção marcada, se houver caixas de seleção."},
    observacoes:{type:"string",description:"Observações adicionais da folha."},
    incertos:{type:"array",description:"Campos vazios, ilegíveis ou com leitura duvidosa.",items:{type:"string",enum:KEYS}}
  },
  required:["transcricao",...KEYS,"incertos"]
};

async function lerComGemini(blob){
  const data=await b64(blob);
  // texto ANTES da imagem (recomendação do Google para 1 imagem + prompt)
  const t=await gem([{type:"text",text:PROMPT_OS},{type:"image",data,mime_type:blob.type||"image/jpeg"}],SCHEMA_OS);
  return normalizarDados(parseJSONSeguro(t));
}

function limparNumeroOS(v){
  return String(v||"").trim().replace(/^(n[º°o]?\.?|n\.?º|os|o\.s\.?|ordem)\s*[:#\-–]?\s*/i,"").trim();
}

function normalizarDados(d){
  const o={};
  KEYS.forEach(k=>o[k]=String(d?.[k]??"").trim());
  o.numero_os=limparNumeroOS(o.numero_os);
  o.ocr_texto=String(d?.transcricao||"").trim();
  let inc=Array.isArray(d?.incertos)?d.incertos.filter(k=>KEYS.includes(k)):[];
  // rede de segurança: se o modelo deixou algum campo vazio, tenta achar na transcrição
  if(o.ocr_texto){
    const alt=extrairCamposOCR(o.ocr_texto);
    KEYS.forEach(k=>{if(!o[k]&&alt[k]){o[k]=alt[k];if(!inc.includes(k))inc.push(k)}});
  }
  KEYS.forEach(k=>{if(!o[k]&&!inc.includes(k))inc.push(k)});
  o.incertos=inc;
  o.origem="gemini";
  return o;
}

async function carregarBitmap(file){
  if(window.createImageBitmap){
    try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){}
  }
  return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(u);res(img)};img.onerror=rej;img.src=u});
}
// 2000px / JPEG 0,9: mantém letra pequena legível para o Gemini
async function reduzir(file,max=2000){
  const img=await carregarBitmap(file);
  const w0=img.width||img.naturalWidth,h0=img.height||img.naturalHeight;
  const k=Math.min(1,max/Math.max(w0,h0));
  const c=document.createElement("canvas");
  c.width=Math.round(w0*k);c.height=Math.round(h0*k);
  const g=c.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);
  g.drawImage(img,0,0,c.width,c.height);
  if(img.close)try{img.close()}catch(e){}
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("falha ao gerar imagem")),"image/jpeg",.9));
}
// Escala de cinza + esticamento de contraste (ajuda o Tesseract)
async function prepararParaOCR(blob){
  const img=await carregarBitmap(blob);
  const c=document.createElement("canvas");
  c.width=img.width||img.naturalWidth;c.height=img.height||img.naturalHeight;
  const g=c.getContext("2d",{willReadFrequently:true});
  g.drawImage(img,0,0);
  if(img.close)try{img.close()}catch(e){}
  const im=g.getImageData(0,0,c.width,c.height),d=im.data,hist=new Uint32Array(256);
  for(let i=0;i<d.length;i+=4){const y=Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2]);d[i]=d[i+1]=d[i+2]=y;hist[y]++}
  const tot=c.width*c.height;let acc=0,lo=0,hi=255;
  for(let i=0;i<256;i++){acc+=hist[i];if(acc>=tot*.01){lo=i;break}}
  acc=0;for(let i=255;i>=0;i--){acc+=hist[i];if(acc>=tot*.01){hi=i;break}}
  const span=Math.max(1,hi-lo);
  for(let i=0;i<d.length;i+=4){const v=Math.max(0,Math.min(255,(d[i]-lo)*255/span));d[i]=d[i+1]=d[i+2]=v}
  g.putImageData(im,0,0);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("falha no preparo")),"image/png"));
}

let ocrWorker=null;
async function obterOCRWorker(){
  if(ocrWorker)return ocrWorker;
  ocrWorker=await Tesseract.createWorker("por",1,{
    logger:m=>{if(m&&typeof m.progress==="number")setMsg("🔎 OCR local lendo a foto... "+Math.round(m.progress*100)+"%")}
  });
  try{await ocrWorker.setParameters({tessedit_pageseg_mode:"6",preserve_interword_spaces:"1"})}catch(e){}
  return ocrWorker;
}
function normalizarOCR(t){
  return (t||"").replace(/\r/g,"").replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
}
async function ocrLocal(blob){
  const worker=await obterOCRWorker();
  let alvo=blob;
  try{alvo=await prepararParaOCR(blob)}catch(e){console.warn("sem pré-processamento",e)}
  const result=await worker.recognize(alvo);
  const texto=normalizarOCR(result?.data?.text||"");
  if(!texto)throw new Error("não foi encontrado texto legível na imagem");
  return texto;
}

// ---- extração por rótulos (reserva). Rótulos específicos, para não casar com o título do formulário ----
const semAcento=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const ROTULOS={
  numero_os:["no ordem de servico","n ordem de servico","ordem de servico","numero da ordem","n da ordem","no da ordem","numero da os","numero os","n os","ordem n","ordem no","o.s. n","os n","n da o.s"],
  equipamento:["tag equipamento","tag do equipamento","equipamento","maquina","tag"],
  servico_solicitado:["problema detectado","servico solicitado","descricao do servico","servico a executar","servico a ser executado","defeito apresentado","solicitacao"],
  executante:["executante","executado por","responsavel pela execucao","responsavel","mecanico","tecnico"],
  tipo_manutencao:["tipo de manutencao","tipo manutencao","tipo da manutencao","manutencao"],
  observacoes:["observacoes","observacao","obs.","servico realizado","causa raiz"]
};
function acharRotulo(linha){
  // troca º/° por "o" (mesmo tamanho) para os índices continuarem alinhados com a linha original
  const l=semAcento(linha).replace(/[°º]/g,"o");
  let melhor=null;
  for(const k of KEYS){
    for(const r of ROTULOS[k]){
      const i=l.indexOf(r);
      if(i<0||i>30)continue;
      // exige que o rótulo termine em fronteira de palavra
      const fim=i+r.length,prox=l[fim]||" ";
      if(/[a-z0-9]/.test(prox))continue;
      if(!melhor||r.length>melhor.len)melhor={k,len:r.length,fim};
    }
  }
  return melhor;
}
function extrairCamposOCR(texto){
  const t=normalizarOCR(texto);
  const linhas=t.split("\n").map(x=>x.trim()).filter(Boolean);
  const dados={};KEYS.forEach(k=>dados[k]="");
  const marcas=linhas.map(acharRotulo);
  for(let i=0;i<linhas.length;i++){
    const m=marcas[i];if(!m||(dados[m.k]&&m.k!=="observacoes"))continue;
    let resto=linhas[i].slice(m.fim).replace(/^[\s:;\-–—.#]+/,"").trim();
    const partes=resto?[resto]:[];
    const maxLinhas=LONG.includes(m.k)?6:(resto?0:1);
    for(let j=i+1;j<linhas.length&&partes.length<(resto?1+maxLinhas:maxLinhas);j++){
      if(marcas[j])break;
      partes.push(linhas[j]);
    }
    const txt=partes.join(" ").trim();
    if(m.k==="observacoes"){
      const rot=linhas[i].slice(0,m.fim).trim();
      const rl=rot.toLowerCase(),pref=/^obs/.test(semAcento(rl))?"":rl.charAt(0).toUpperCase()+rl.slice(1)+": ";
      if(txt)dados.observacoes=(dados.observacoes?dados.observacoes+"\n":"")+pref+txt;
    }else dados[m.k]=txt;
  }
  if(!dados.numero_os){
    const m=t.match(/(?:\bO\.?\s?S\.?|ORDEM(?:\s+DE\s+SERVI[ÇC]O)?)\s*(?:N[º°o.]*)?\s*[:#\-]?\s*([A-Z]{0,3}[-/]?\d{2,}[A-Z0-9\-/]*)/i);
    if(m)dados.numero_os=m[1];
  }
  dados.numero_os=limparNumeroOS(dados.numero_os);
  return {...dados,incertos:KEYS.filter(k=>!dados[k]),ocr_texto:t,origem:"ocr"};
}

async function processarOCR(somenteLocal){
  if(busy)return;
  if(!photo){msg="📷 Primeiro tire uma foto ou escolha uma imagem da galeria/arquivos.";render();return}
  busy=true;render();
  let erroIA="";
  try{
    if(ia&&Core.can("usar_ia")&&!somenteLocal){
      try{
        setMsg("🤖 Gemini lendo a foto da OS...");
        draft=await lerComGemini(photo.blob);
        const n=draft.incertos.length;
        msg="✅ Gemini leu a foto ("+modeloUsado+")."+(n?" ⚠️ "+n+" campo(s) para conferir (destacados em amarelo).":" Confira antes de salvar.");
        return;
      }catch(e){console.error(e);erroIA=e.message||"erro desconhecido"}
    }
    setMsg("🔎 OCR local lendo a foto...");
    const texto=await ocrLocal(photo.blob);
    draft=extrairCamposOCR(texto);
    if(erroIA)msg="⚠️ O Gemini falhou: "+erroIA+". Usei o OCR local — confira os campos com atenção.";
    else if(!ia&&!somenteLocal)msg="✅ OCR local concluído. Peça ao administrador para configurar a chave do Gemini (painel admin) para uma leitura bem mais precisa. Confira os campos.";
    else msg="✅ OCR local concluído. Confira e ajuste os campos.";
  }catch(e){
    console.error(e);
    msg="❌ Não foi possível ler a imagem"+(erroIA?" (Gemini: "+erroIA+")":"")+": "+(e.message||"erro desconhecido")+". Preencha os campos manualmente.";
  }finally{
    busy=false;render();
  }
}

  const t=($("#busca")?.value||window._b||"").toLowerCase();window._b=t;
  const r=t?visiveis().filter(x=>JSON.stringify(x).toLowerCase().includes(t)):[];
  return `<div class="card"><b>🔎 Pesquisa</b><input id="busca" placeholder="Ordem, equipamento, serviço, executante..." value="${esc(t)}" oninput="window._b=this.value;render(true)">
  ${t?(r.length?r.map(linha).join(""):`<p class="mut">Nenhum resultado.</p>`):`<p class="mut">Digite para buscar no histórico.</p>`}</div>`;
}
function visiveis(){
  if(Core.aberto()||Core.can("ver_historico"))return rec;
  const u=Core.usuario();return rec.filter(r=>u&&r.usuario_id===u.id);
}
function telaCompat(){
  const u=Core.usuario();
  const perms=Core.PERMS.filter(([k])=>Core.can(k)).map(([,l])=>l);
  return `<div class="card"><b>👤 Conta</b>
  ${u?`<div class="mut">Usuário: <b>${esc(u.nome)}</b> · Cargo: <b>${esc(u.cargo)}</b> (nível ${u.nivel})</div>
  <button type="button" class="sec" onclick="sair()">Sair</button>`:`<div class="mut">Acesso livre: ainda não há usuários cadastrados. Para ativar login e cargos, abra o <a class="lk" style="margin:0" href="admin.html">painel administrador</a> e crie o primeiro administrador.</div>`}
  <div class="mut" style="margin-top:8px">Leitura por IA: ${ia?"🟢 disponível":"🔴 não configurada (o administrador configura a chave no painel)"}</div>
  ${u?`<div class="mut" style="margin-top:8px"><b>Suas permissões:</b> ${esc(perms.join(" · ")||"nenhuma")}</div>`:""}
  <div class="mut" style="margin-top:12px">📷 Fluxo da leitura: <b>foto → Gemini (lê a imagem e preenche os campos)</b>. Se a IA não estiver disponível, o app usa o <b>OCR local (Tesseract)</b>.</div>
  </div>
  ${ia&&Core.can("consultar_ia")?`<div class="card"><b>💬 Perguntar ao histórico</b>
  <textarea id="q" placeholder="Ex.: Quais equipamentos tiveram manutenção?">${esc(window._q||"")}</textarea>
  <button ${busy?"disabled":""} onclick="window._q=$('#q').value;perguntar()">Perguntar ao histórico</button>
  <pre id="resp">${esc(ia_resp)}</pre></div>`:""}`;
}
function telaLogin(){
  const us=Core.users().filter(u=>u.ativo);
  return `<div class="card"><b>🔐 Entrar</b>
   <label>Usuário</label><select id="l_user" style="width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)">${us.map(u=>`<option value="${u.id}">${esc(u.nome)} — ${esc(u.cargo)}</option>`).join("")}</select>
   <label>PIN</label><input id="l_pin" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrarApp()">
   <div class="err">${esc(loginMsg)}</div>
   <button type="button" onclick="entrarApp()">Entrar</button>
   <div class="mut" style="margin-top:10px">Sem acesso? Peça ao administrador para criar seu usuário.</div></div>`;
}
async function entrarApp(){
  const r=await Core.login($("#l_user")?.value,$("#l_pin")?.value||"");
  loginMsg=r.ok?"":r.erro;if(r.ok){msg="";tab="nova"}render();
}
function sair(){Core.logout();draft=null;photo=null;editId=null;msg="";loginMsg="";render()}
function atualizarHeader(){
  const el=$("#uinfo"),u=Core.usuario();if(!el)return;
  el.innerHTML=u?`<b>${esc(u.nome)}</b> · ${esc(u.cargo)}${Core.can("painel_admin")?` <a class="lk" href="admin.html">⚙️ Admin</a>`:""} <a class="lk" onclick="sair()">Sair</a>`:"";
}

function linha(r){return `<div class="row"><b>Ordem ${esc(r.numero_os||"s/n")}</b> · ${esc(r.equipamento||"—")}<div class="mut"><b>Serviço:</b> ${esc(r.servico_solicitado||"—")}</div><div class="mut"><b>Executante:</b> ${esc(r.executante||"—")} · <b>Manutenção:</b> ${esc(r.tipo_manutencao||"—")}</div><div class="mut"><b>Observação:</b> ${esc(r.observacoes||"—")}</div>${r.usuario?`<div class="mut">Registrado por ${esc(r.usuario)}</div>`:""}${r.foto?`<button class="sec" style="width:auto;padding:6px 10px" onclick="ver('${r.id}')">📎 foto</button> `:""}${Core.can("editar_os")?`<button class="sec" style="width:auto;padding:6px 10px" onclick="editar('${r.id}')">✏️ Editar</button> `:""}${Core.can("excluir_os")?`<button class="sec del" style="width:auto;padding:6px 10px;background:none;color:var(--bad);border-color:var(--bad)" onclick="apagar('${r.id}')">Excluir</button>`:""}<div id="v_${r.id}"></div></div>`}
function telaHist(){const rec=visiveis();return `<div class="card"><b>📊 Histórico (${rec.length})</b><div class="mut">${esc(msg)}</div>${rec.map(linha).join("")||`<p class="mut">Nenhuma OS ainda.</p>`}${Core.can("exportar")?`<button onclick="exportar()">⬇️ Exportar Excel (.xlsx)</button>`:""}</div>`}
function telaDash(){
  const rec=visiveis();
  const uniq=k=>new Set(rec.map(r=>(r[k]||"").trim().toLowerCase()).filter(Boolean)).size;
  const top=k=>{const m={};rec.forEach(r=>{const v=(r[k]||"").trim();if(v)m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5)};
  const lista=(t,k)=>`<div class="card"><b>${t}</b>${top(k).map(([n,c])=>`<div class="row">${esc(n)} <span class="mut">× ${c}</span></div>`).join("")||`<p class="mut">—</p>`}</div>`;
  return `<div class="kpis"><div class="kpi"><b>${rec.length}</b>Ordens</div><div class="kpi"><b>${uniq("equipamento")}</b>Equipamentos</div><div class="kpi"><b>${uniq("executante")}</b>Executantes</div><div class="kpi"><b>${uniq("tipo_manutencao")}</b>Tipos de manutenção</div></div><div style="height:12px"></div>${lista("Equipamentos mais frequentes","equipamento")}${lista("Tipos de manutenção","tipo_manutencao")}${lista("Executantes mais frequentes","executante")}`;
}
async function ver(id){const el=$("#v_"+id);if(el.innerHTML){el.innerHTML="";return}const b=await fotoGet(id);el.innerHTML=b?`<img class="prev" src="${URL.createObjectURL(b)}">`:`<div class="mut">Foto não encontrada.</div>`}
async function apagar(id){if(!Core.can("excluir_os"))return;if(!confirm("Excluir esta OS?"))return;rec=Core.regs().filter(r=>r.id!==id);await fotoDel(id);salvarRegs();render()}
function editar(id){if(!Core.can("editar_os"))return;const r=Core.regs().find(x=>x.id===id);if(!r)return;editId=id;draft={...r,incertos:[],origem:""};photo=null;tab="nova";msg="✏️ Editando a OS "+(r.numero_os||"s/n")+". Altere os campos e confirme.";render()}

const TABS_ALL=[["nova","📷","Nova OS","criar_os"],["pesq","🔎","Pesquisa","pesquisar"],["hist","📊","Histórico",null],["dash","📈","Dashboard","dashboard"],["compat","👤","Conta",null]];
function tabsVisiveis(){return TABS_ALL.filter(t=>!t[3]||Core.can(t[3])||(t[0]==="nova"&&editId)).map(t=>[t[0],t[1],t[2]])}
async function tratarArquivos(files){
  const lista=Array.from(files||[]).filter(f=>f.type&&f.type.startsWith("image/"));
  if(!lista.length)return;
  const f=lista[0];
  try{
    setMsg("📷 Preparando a imagem...");
    const blob=await reduzir(f);
    if(photo?.url)try{URL.revokeObjectURL(photo.url)}catch(x){}
    photo={blob,url:URL.createObjectURL(blob),nome:f.name};
    msg="✅ Imagem pronta. Toque em LER E PREENCHER AUTOMATICAMENTE.";
    render();
  }catch(x){
    console.error(x);
    msg="❌ Não consegui abrir essa imagem. Tente selecionar outra foto.";
    render();
  }
}
function render(keep){
  const a=$("#app"),foc=document.activeElement?.id,pos=document.activeElement?.selectionStart;
  ia=!!getKey();rec=Core.regs();atualizarHeader();
  if(Core.exigeLogin()){a.innerHTML=telaLogin();$("#nav").innerHTML="";return}
  const TV=tabsVisiveis();if(!TV.some(t=>t[0]===tab))tab=TV[0][0];
  a.innerHTML={nova:telaNova,pesq:telaPesq,compat:telaCompat,hist:telaHist,dash:telaDash}[tab]();
  $("#nav").innerHTML=TV.map(([k,i,l])=>`<a class="${k===tab?"on":""}" onclick="tab='${k}';msg='';render()"><b>${i}</b>${l}</a>`).join("");
  const c=$("#cam"),g=$("#gal");
  if(c)c.onchange=async e=>{await tratarArquivos(e.target.files);c.value=""};
  if(g)g.onchange=async e=>{await tratarArquivos(e.target.files);g.value=""};
  if(keep&&foc){const e=document.getElementById(foc);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
}
render();
aplicarTema(temaAtual());
</script>
</body>
</html>
