<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Painel Administrativo — Gestão de OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="core.js"></script>
<style>
:root{--bg:#000;--card:#0e0e0e;--tx:#fff;--mut:#a6a6a6;--pri:#ffff00;--onpri:#000;--pribg:rgba(255,255,0,.14);--navbg:#000;--bd:#3d3d3d;--line:#b7b7b7;--warn:#ff9800;--ok:#00b050;--bad:#ff0000;--c1:#ffff00;--c2:#0070c0;--c3:#00b050;--c4:#b1a0c7;--c5:#ff0000;--c6:#a6a6a6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f2f2f2;--card:#fff;--tx:#000;--mut:#5c5c5c;--pri:#000;--onpri:#ffff00;--pribg:rgba(0,0,0,.08);--navbg:#fff;--bd:#d0d0d0;--line:#000;--warn:#e65100;--bad:#d50000;--c1:#d4b200;color-scheme:light}
:root[data-theme="light"] header img{filter:invert(1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:78px}
header{padding:14px 16px 12px;font-weight:700;font-size:17px;border-bottom:1px solid var(--line);margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:34px;width:auto;display:block}
header .t{flex:1;min-width:180px}
header small{display:block;font-weight:400;color:var(--mut);font-size:12px}
header a,.lnk{color:var(--pri);font-size:12px;text-decoration:underline;margin-left:8px;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:var(--pri);color:var(--onpri);font-weight:600;width:100%;margin-top:8px;cursor:pointer}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button.s{width:auto;padding:6px 10px;margin:0;font-size:13px}
button.tema{width:auto;margin:0;padding:8px 12px;background:transparent;color:var(--tx);border:1px solid var(--line);font-size:16px;line-height:1}
button:disabled{opacity:.5;cursor:default}
label{display:block;font-size:12px;color:var(--mut);margin-top:10px}
input,textarea,select{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input[type=checkbox]{width:auto}
textarea{min-height:70px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--navbg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:10px 0;font-size:11px;color:var(--mut);cursor:pointer}
nav a.on{color:var(--pri);font-weight:700}
nav a b{display:block;font-size:20px}
img.prev{width:100%;max-width:520px;border-radius:10px;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center;font-size:13px;color:var(--mut)}
.kpi b{display:block;font-size:26px;color:var(--pri)}
.row{border-bottom:1px solid var(--bd);padding:10px 0}
.row:last-child{border:0}
.mut{color:var(--mut);font-size:13px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--pribg);color:var(--pri);margin-left:6px;vertical-align:middle}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.inline select{width:auto;min-width:140px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--tx);margin:6px 0}
.permgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 12px;margin-top:6px}
.err{color:var(--bad);font-size:13px;margin-top:8px}
/* gráficos */
.bar{display:grid;grid-template-columns:minmax(80px,38%) 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar .tr{background:var(--bd);border-radius:6px;height:14px;overflow:hidden}
.bar .fl{height:100%;background:var(--c1);border-radius:6px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .vl{text-align:right;font-weight:700}
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:18px}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}
.cols .c i{display:block;width:100%;background:var(--c1);border-radius:5px 5px 0 0;min-height:2px}
.cols .c span{color:var(--tx);font-weight:700;margin-bottom:2px}
.donutw{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.leg{font-size:13px;flex:1;min-width:150px}
.leg div{display:flex;align-items:center;gap:8px;margin:4px 0}
.leg i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
h3{margin:0 0 6px;font-size:15px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px}
.md{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;width:100%;max-width:560px}
</style>
</head>

<script>
Core.iniciarTema();
const $=s=>document.querySelector(s);
const esc=Core.esc;
const CAMPOS=[["numero_os","Número da Ordem"],["equipamento","Equipamento"],["servico_solicitado","Serviço solicitado"],["executante","Executante"],["tipo_manutencao","Tipo de manutenção"],["observacoes","Observação"]];
const LONG=["servico_solicitado","observacoes"];
let tab="dash",msg="",loginMsg="",setupMsg="",edit=null;
let F={de:"",ate:"",equip:"",exec:"",tipo:"",user:"",q:""};

/* ---------- utilidades ---------- */
const norm=s=>String(s||"").trim().toLowerCase();
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const splitExec=s=>String(s||"").split(/[,;\n]| e /i).map(x=>x.trim()).filter(Boolean);
const SEM_USER="(sem usuário)";
function dataLocal(r){const d=new Date(r.criado);if(isNaN(d))return "";return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function contar(valores){
  const m=new Map();
  valores.forEach(v=>{const k=norm(v);if(!k)return;const o=m.get(k)||{nome:cap(String(v).trim()),n:0};o.n++;m.set(k,o)});
  return [...m.values()].sort((a,b)=>b.n-a.n||a.nome.localeCompare(b.nome));
}
function filtrar(lista,comBusca){
  return lista.filter(r=>{
    const d=dataLocal(r);
    if(F.de&&(!d||d<F.de))return false;
    if(F.ate&&(!d||d>F.ate))return false;
    if(F.equip&&norm(r.equipamento)!==F.equip)return false;
    if(F.exec&&!splitExec(r.executante).map(norm).includes(F.exec))return false;
    if(F.tipo&&norm(r.tipo_manutencao)!==F.tipo)return false;
    if(F.user&&(r.usuario||SEM_USER)!==F.user)return false;
    if(comBusca&&F.q&&!JSON.stringify(r).toLowerCase().includes(F.q.toLowerCase()))return false;
    return true;
  });
}
const opcoes=(lista,sel)=>`<option value="">Todos</option>`+lista.map(o=>`<option value="${esc(norm(o.nome))}" ${norm(o.nome)===sel?"selected":""}>${esc(o.nome)}</option>`).join("");
function barraFiltros(all,comBusca){
  const eq=contar(all.map(r=>r.equipamento)),ex=contar(all.flatMap(r=>splitExec(r.executante))),ti=contar(all.map(r=>r.tipo_manutencao));
  const us=[...new Set(all.map(r=>r.usuario||SEM_USER))].sort();
  return `<div class="card"><b>Filtros</b>
   <div class="grid">
    <div><label>De</label><input type="date" value="${esc(F.de)}" onchange="F.de=this.value;render()"></div>
    <div><label>Até</label><input type="date" value="${esc(F.ate)}" onchange="F.ate=this.value;render()"></div>
    <div><label>Equipamento</label><select onchange="F.equip=this.value;render()">${opcoes(eq,F.equip)}</select></div>
    <div><label>Executante</label><select onchange="F.exec=this.value;render()">${opcoes(ex,F.exec)}</select></div>
    <div><label>Tipo de manutenção</label><select onchange="F.tipo=this.value;render()">${opcoes(ti,F.tipo)}</select></div>
    <div><label>Registrado por</label><select onchange="F.user=this.value;render()"><option value="">Todos</option>${us.map(u=>`<option value="${esc(u)}" ${u===F.user?"selected":""}>${esc(u)}</option>`).join("")}</select></div>
   </div>
   ${comBusca?`<label>Busca</label><input id="busca" placeholder="Ordem, equipamento, serviço, executante..." value="${esc(F.q)}" oninput="F.q=this.value;render(true)">`:""}
   <button type="button" class="sec s" style="margin-top:10px" onclick="F={de:'',ate:'',equip:'',exec:'',tipo:'',user:'',q:''};render()">Limpar filtros</button>
  </div>`;
}

/* ---------- gráficos (sem bibliotecas) ---------- */
function donut(entries){
  const tot=entries.reduce((a,e)=>a+e.n,0);
  if(!tot)return `<p class="mut">Sem dados.</p>`;
  let list=entries;
  if(list.length>6){const resto=list.slice(5).reduce((a,e)=>a+e.n,0);list=[...list.slice(0,5),{nome:"Outros",n:resto}]}
  let acc=0;
  const segs=list.map((e,i)=>{const p=e.n/tot*100;const s=`<circle r="15.915" cx="21" cy="21" fill="none" stroke="var(--c${i+1})" stroke-width="7" stroke-dasharray="${p.toFixed(3)} ${(100-p).toFixed(3)}" stroke-dashoffset="${(25-acc).toFixed(3)}"/>`;acc+=p;return s}).join("");
  const leg=list.map((e,i)=>`<div><i style="background:var(--c${i+1})"></i><span style="flex:1">${esc(e.nome)}</span><b>${(e.n/tot*100).toFixed(0)}%</b> <span class="mut">(${e.n})</span></div>`).join("");
  return `<div class="donutw"><svg viewBox="0 0 42 42" width="150" height="150" role="img" aria-label="Percentual por tipo">${segs}<text x="21" y="22.5" text-anchor="middle" font-size="7" font-weight="700" fill="var(--tx)">${tot}</text></svg><div class="leg">${leg}</div></div>`;
}
function barrasH(entries,max=8){
  const l=entries.slice(0,max);
  if(!l.length)return `<p class="mut">Sem dados.</p>`;
  const m=Math.max(...l.map(e=>e.n));
  return l.map(e=>`<div class="bar"><span class="nm" title="${esc(e.nome)}">${esc(e.nome)}</span><div class="tr"><div class="fl" style="width:${(e.n/m*100).toFixed(1)}%"></div></div><span class="vl">${e.n}</span></div>`).join("");
}
function colunasMes(L){
  const hoje=new Date(),meses=[];
  for(let i=11;i>=0;i--){const d=new Date(hoje.getFullYear(),hoje.getMonth()-i,1);meses.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))}
  const cont={};meses.forEach(m=>cont[m]=0);
  L.forEach(r=>{const m=dataLocal(r).slice(0,7);if(m in cont)cont[m]++});
  const mx=Math.max(1,...meses.map(m=>cont[m]));
  return `<div class="cols">${meses.map(m=>`<div class="c"><span>${cont[m]||""}</span><i style="height:${(cont[m]/mx*100).toFixed(1)}%"></i>${m.slice(5)}/${m.slice(2,4)}</div>`).join("")}</div>`;
}

/* ---------- ações: cargos ---------- */
function setPerm(i,p,on){
  const cs=Core.cargos(),c=cs[i];if(!c||c.fixo)return;
  const novo=on?[...new Set([...c.perms,p])]:c.perms.filter(x=>x!==p);
  if(p==="painel_admin"&&!on){
    const resta=Core.users().filter(u=>u.ativo&&(u.cargo===c.nome?novo:Core.permsDoCargo(u.cargo)).includes("painel_admin")).length;
    if(!resta){msg="⚠️ É preciso manter pelo menos um administrador ativo.";render();return}
  }
  c.perms=novo;Core.saveCargos(cs);msg="✅ Permissões de "+c.nome+" atualizadas.";render();
}
function renomearCargo(i,nome){
  nome=String(nome||"").trim();const cs=Core.cargos(),c=cs[i];if(!c||c.fixo)return;
  if(!nome||cs.some((x,j)=>j!==i&&x.nome.toLowerCase()===nome.toLowerCase())){msg="⚠️ Nome vazio ou já usado por outro cargo.";render();return}
  const us=Core.users();us.forEach(u=>{if(u.cargo===c.nome)u.cargo=nome});
  c.nome=nome;Core.saveCargos(cs);Core.saveUsers(us);msg="✅ Cargo renomeado.";render();
}
function setNivel(i,v){
  const cs=Core.cargos(),c=cs[i];if(!c||c.fixo)return;
  const n=Math.max(1,Math.min(98,parseInt(v,10)||1));c.nivel=n;Core.saveCargos(cs);msg="✅ Senioridade atualizada.";render();
}
function excluirCargo(i){
  const cs=Core.cargos(),c=cs[i];if(!c||c.fixo)return;
  if(Core.users().some(u=>u.cargo===c.nome)){msg="⚠️ Há usuários neste cargo. Mude o cargo deles antes de excluir.";render();return}
  if(!confirm("Excluir o cargo "+c.nome+"?"))return;
  cs.splice(i,1);Core.saveCargos(cs);msg="🗑️ Cargo excluído.";render();
}
function criarCargo(){
  const nome=($("#nc_nome").value||"").trim(),nivel=Math.max(1,Math.min(98,parseInt($("#nc_nivel").value,10)||1)),copia=$("#nc_copia").value;
  const cs=Core.cargos();
  if(!nome||cs.some(x=>x.nome.toLowerCase()===nome.toLowerCase())){msg="⚠️ Informe um nome que ainda não exista.";render();return}
  const base=copia?(cs.find(x=>x.nome===copia)||{perms:[]}).perms.filter(p=>p!=="painel_admin"):["criar_os","pesquisar"];
  cs.push({nome,nivel,perms:base.slice()});Core.saveCargos(cs);msg="✅ Cargo "+nome+" criado.";render();
}

function salvarChave(){const k=($("#gk").value||"").trim();try{if(k)localStorage.setItem("gem_key",k);else localStorage.removeItem("gem_key")}catch(e){}cfgMsg(k?"✅ Chave salva neste aparelho.":"⚠️ Chave vazia: removida.")}
function removerChave(){try{localStorage.removeItem("gem_key")}catch(e){}$("#gk").value="";cfgMsg("🗑️ Chave removida.")}
async function testarChave(){
  const k=($("#gk").value||"").trim();
  if(k)try{localStorage.setItem("gem_key",k)}catch(e){}
  const key=(()=>{try{return localStorage.getItem("gem_key")||""}catch(e){return ""}})();
  if(!key){cfgMsg("⚠️ Cole a chave primeiro.");return}
  cfgMsg("⏳ Testando...");
  let ult="";
  for(const model of ["gemini-3.8-flash","gemini-3.5-flash"]){
    try{
      const r=await fetch("https://generativelanguage.googleapis.com/v1beta/interactions",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({model,input:"Responda apenas com a palavra OK."})});
      const j=await r.json().catch(()=>({}));
      if(r.ok){cfgMsg("✅ Funcionando com "+model);return}
      ult=(j?.error?.message||("HTTP "+r.status))+" ["+model+"]";
      if([400,401,403].includes(r.status))break;
    }catch(e){ult=(e.message||"falha de rede")+" ["+model+"]"}
  }
  cfgMsg("❌ "+ult);
}

  const e=$("#bkmsg");if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||!Array.isArray(d.os_regs))throw new Error("arquivo inválido");
    const regs=Core.regs(),ids=new Set(regs.map(r=>r.id));
    let nr=0;d.os_regs.forEach(r=>{if(r&&r.id&&!ids.has(r.id)){regs.push(r);nr++}});Core.saveRegs(regs);
    const us=Core.users(),uid=new Set(us.map(u=>u.id)),nomes=new Set(us.map(u=>u.nome.toLowerCase()));
    let nu=0;(d.os_users||[]).forEach(u=>{if(u&&u.id&&u.hash&&!uid.has(u.id)&&!nomes.has(String(u.nome).toLowerCase())){us.push(u);nu++}});Core.saveUsers(us);
    const cs=Core.cargos(),cn=new Set(cs.map(c=>c.nome));
    let nc=0;(d.os_cargos||[]).forEach(c=>{if(c&&c.nome&&!c.fixo&&!cn.has(c.nome)){cs.push({nome:c.nome,nivel:Math.max(1,Math.min(98,c.nivel||1)),perms:(c.perms||[]).filter(p=>Core.TODAS.includes(p))});nc++}});Core.saveCargos(cs);
    if(e)e.textContent="✅ Importado: "+nr+" OS, "+nu+" usuário(s), "+nc+" cargo(s) novos.";
  }catch(x){if(e)e.textContent="❌ Não consegui importar: "+(x.message||"erro")}
}

/* ---------- navegação ---------- */
const TABS=[["dash","📈","Dashboard"],["os","📋","OS"],["users","👥","Usuários"],["cargos","🎖️","Cargos"],["config","⚙️","Config."]];
function render(keep){
  const a=$("#app"),nav=$("#nav");
  const foc=document.activeElement?.id,pos=document.activeElement?.selectionStart;
  atualizarHeader();
  const semAdmin=Core.users().filter(u=>u.ativo&&Core.permsDoCargo(u.cargo).includes("painel_admin")).length===0;
  if(semAdmin){a.innerHTML=telaSetup();nav.innerHTML="";return}
  if(!Core.usuario()||!Core.can("painel_admin")){
    if(Core.usuario())Core.logout();
    a.innerHTML=telaLogin();nav.innerHTML="";return;
  }
  a.innerHTML=({dash:telaDash,os:telaOS,users:telaUsers,cargos:telaCargos,config:telaConfig}[tab])()+modalEdicao();
  nav.innerHTML=TABS.map(([k,i,l])=>`<a class="${k===tab?"on":""}" onclick="tab='${k}';msg='';render()"><b>${i}</b>${l}</a>`).join("");
  if(keep&&foc){const e=document.getElementById(foc);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
}
render();
Core.aplicarTema(Core.temaAtual());
</script>
</body>
