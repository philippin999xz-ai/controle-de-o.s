<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestão de OS</title>
<style>
:root{font-family:Arial,sans-serif;color:#18212b;background:#f4f6f8}*{box-sizing:border-box}body{margin:0;padding-bottom:80px}header{background:#0b5fff;color:#fff;padding:18px;font-size:20px;font-weight:700}header small{display:block;font-size:12px;font-weight:400;margin-top:4px}main{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0001}button{width:100%;padding:13px;margin-top:9px;border:0;border-radius:10px;background:#0b5fff;color:#fff;font-size:15px;font-weight:700}button.secondary{background:#fff;color:#0b5fff;border:1px solid #0b5fff}button.danger{background:#fff;color:#c62828;border:1px solid #c62828}button:disabled{opacity:.5}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px;color:#52606d}input,textarea{width:100%;padding:11px;border:1px solid #ccd4dd;border-radius:9px;font:inherit;background:#fff}textarea{min-height:80px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.full{grid-column:1/-1}.preview{width:100%;border-radius:10px;margin-top:10px;max-height:420px;object-fit:contain;background:#eee}.muted{color:#667085;font-size:13px}.status{padding:10px;border-radius:9px;background:#eef4ff;margin-top:10px}.item{border-top:1px solid #e4e7eb;padding:12px 0}.item:first-child{border-top:0}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10}.nav button{margin:0;border-radius:0;background:#fff;color:#667085;font-size:11px;padding:9px 2px}.nav button.active{color:#0b5fff;font-weight:700}.nav span{display:block;font-size:19px}.hidden{display:none}.warning{background:#fff7df;border:1px solid #e7b64a;padding:10px;border-radius:9px}.success{background:#eaf8ef;border:1px solid #7bc58c;padding:10px;border-radius:9px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header>🛠️ Gestão Inteligente de OS<small>Foto → leitura automática → conferência → histórico</small></header>
<main id="app"></main>
<div class="nav" id="nav"></div>

<script>
'use strict';
const FIELDS=[
 ['numero_os','Número da Ordem'],
 ['equipamento','Equipamento'],
 ['servico_solicitado','Serviço solicitado'],
 ['executante','Executante'],
 ['tipo_manutencao','Tipo de manutenção'],
 ['observacao','Observação']
];
let tab='nova',foto=null,dados={},registros=[],status='',busy=false;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{registros=JSON.parse(localStorage.getItem('os_registros')||'[]')}catch(e){registros=[]}}
function save(){localStorage.setItem('os_registros',JSON.stringify(registros))}
load();

function render(){
 const app=$('app');
 if(tab==='nova') app.innerHTML=nova();
 if(tab==='hist') app.innerHTML=historico();
 if(tab==='sobre') app.innerHTML=sobre();
 $('nav').innerHTML=`<button class="${tab==='nova'?'active':''}" onclick="tab='nova';render()"><span>📷</span>Nova OS</button><button class="${tab==='hist'?'active':''}" onclick="tab='hist';render()"><span>📊</span>Histórico</button><button class="${tab==='sobre'?'active':''}" onclick="tab='sobre';render()"><span>⚙️</span>Config.</button>`;
 const input=$('foto');
 if(input) input.onchange=escolherFoto;
}
function nova(){
 if(Object.keys(dados).length){return `<div class="card"><b>Confira os dados</b><div class="muted">A IA preencheu o que conseguiu identificar. Corrija antes de salvar.</div>${foto?`<img class="preview" src="${foto.url}">`:''}${camposFormulario()}<button onclick="salvarOS()">✅ SALVAR ORDEM DE SERVIÇO</button><button class="secondary" onclick="dados={};foto=null;status='';render()">Cancelar</button></div>`}
 return `<div class="card"><b>Nova Ordem de Serviço</b><p class="muted">Tire uma foto da OS ou escolha uma imagem. Depois, toque em Processar foto.</p><input id="foto" class="hidden" type="file" accept="image/*" capture="environment"><button onclick="$('foto').click()">📷 TIRAR FOTO / ESCOLHER IMAGEM</button>${foto?`<img class="preview" src="${foto.url}"><button onclick="processarFoto()" ${busy?'disabled':''}>🤖 ${busy?'PROCESSANDO...':'PROCESSAR FOTO'}</button>`:''}<button class="secondary" onclick="dados={};render()">✍️ PREENCHER MANUALMENTE</button>${status?`<div class="status">${esc(status)}</div>`:''}</div>`;
}
function camposFormulario(){return `<div class="grid">${FIELDS.map(([k,l],i)=>`<div class="${i===2||i===5?'full':''}"><label>${l}</label>${i===2||i===5?`<textarea id="f_${k}">${esc(dados[k]||'')}</textarea>`:`<input id="f_${k}" value="${esc(dados[k]||'')}">`}</div>`).join('')}</div>`}
async function escolherFoto(e){const file=e.target.files&&e.target.files[0];if(!file)return;try{const data=await redimensionar(file);foto={blob:data,url:URL.createObjectURL(data)};status='Foto carregada. Agora toque em PROCESSAR FOTO.';render()}catch(err){status='Não foi possível carregar a foto.';render()}}
function redimensionar(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?resolve(b):reject(new Error('imagem')),'image/jpeg',.82)};img.onerror=reject;img.src=url})}
function getKey(){return localStorage.getItem('gemini_api_key')||''}
function configurar(){const atual=getKey();const k=prompt('Cole sua chave da API do Google Gemini:',atual);if(k!==null){localStorage.setItem('gemini_api_key',k.trim());status='Chave salva neste aparelho.';render()}}
function limparChave(){localStorage.removeItem('gemini_api_key');status='Chave removida deste aparelho.';render()}
async function processarFoto(){
 if(!foto){return} const key=getKey();if(!key){alert('Primeiro configure sua chave do Gemini na aba Config.');return}
 busy=true;status='Enviando a foto para o Gemini...';render();
 try{
  const base64=await blobBase64(foto.blob);
  const prompt=`Leia esta Ordem de Serviço de manutenção. Extraia SOMENTE informações claramente visíveis. Não invente. Responda SOMENTE em JSON válido, exatamente com estas chaves: numero_os, equipamento, servico_solicitado, executante, tipo_manutencao, observacao. Se não encontrar algum campo, use string vazia.`;
  const body={contents:[{parts:[{text:prompt},{inline_data:{mime_type:'image/jpeg',data:base64}}]}],generationConfig:{responseMimeType:'application/json',temperature:0}};
  const models=['gemini-3.8-flash','gemini-3.7-flash','gemini-2.5-flash'];
  let resposta=null,last='';
  for(const model of models){
   try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});const j=await r.json();if(!r.ok){last=j?.error?.message||('HTTP '+r.status);continue}resposta=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('');if(resposta)break}catch(e){last=e.message||'erro'}
  }
  if(!resposta)throw new Error(last||'O Gemini não retornou dados.');
  const limpo=resposta.replace(/```json|```/g,'').trim();dados=JSON.parse(limpo);status='Leitura concluída. Confira os campos antes de salvar.';
 }catch(e){dados={};status='Erro na leitura: '+(e.message||'falha')+'. Você pode preencher manualmente.'}
 busy=false;render();
}
function blobBase64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)})}
function salvarOS(){
 const o={id:Date.now().toString(),criado:new Date().toISOString()};FIELDS.forEach(([k])=>o[k]=($('f_'+k)?.value||'').trim());
 if(!o.numero_os&&!o.equipamento){alert('Informe pelo menos o Número da Ordem ou o Equipamento.');return}
 registros.unshift(o);save();dados={};foto=null;status='OS salva com sucesso.';tab='hist';render();
}
function historico(){return `<div class="card"><b>📊 Histórico (${registros.length})</b>${registros.length?registros.map((r,i)=>`<div class="item"><b>OS ${esc(r.numero_os||'sem número')}</b><br>${esc(r.equipamento||'Sem equipamento')}<div class="muted">${esc(r.tipo_manutencao||'')} · ${esc(r.executante||'')}</div><div>${esc(r.servico_solicitado||'')}</div><div class="muted">${esc(r.observacao||'')}</div><button class="danger" onclick="excluir(${i})">Excluir</button></div>`).join(''):'<p class="muted">Nenhuma OS cadastrada ainda.</p>'}<button onclick="exportarExcel()">⬇️ EXPORTAR PARA EXCEL</button></div>`}
function excluir(i){if(confirm('Excluir esta OS?')){registros.splice(i,1);save();render()}}
function exportarExcel(){
 const linhas=registros.map(r=>({'Número da Ordem':r.numero_os||'','Equipamento':r.equipamento||'','Serviço solicitado':r.servico_solicitado||'','Executante':r.executante||'','Tipo de manutenção':r.tipo_manutencao||'','Observação':r.observacao||'','Criado em':r.criado||''}));
 const csv=[Object.keys(linhas[0]||{'Número da Ordem':'','Equipamento':'','Serviço solicitado':'','Executante':'','Tipo de manutenção':'','Observação':'','Criado em':''}),...linhas.map(Object.values)].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
 const blob=new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='historico_os.csv';a.click();URL.revokeObjectURL(a.href)
}
function sobre(){const ok=!!getKey();return `<div class="card"><b>⚙️ Configuração</b><p class="muted">A chave fica salva somente neste navegador.</p>${ok?'<div class="success">✅ Chave do Gemini configurada.</div>':'<div class="warning">⚠️ Chave do Gemini ainda não configurada.</div>'}<button onclick="configurar()">🔑 ${ok?'Alterar':'Configurar'} chave Gemini</button>${ok?'<button class="danger" onclick="limparChave()">Remover chave</button>':''}<hr><p class="muted">A leitura automática usa a API do Google Gemini. O histórico desta versão fica salvo localmente no aparelho.</p></div>`}
render();
</script>
</body>
</html>
