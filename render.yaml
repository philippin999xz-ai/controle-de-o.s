# Blueprint do Render: UM serviço que entrega o front (dist/) e a API (/api/*).
services:
  - type: web
    name: controle-de-o-s
    runtime: node
    plan: free
    rootDir: .                      # raiz do repositório (NÃO use "backend")
    buildCommand: npm run build:render
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GEMINI_API_KEY
        sync: false                 # cole a chave no painel do Render (nunca no código)
      - key: TURSO_DATABASE_URL
        sync: false                 # libsql://... (painel do Turso)
      - key: TURSO_AUTH_TOKEN
        sync: false                 # token do banco (painel do Turso)
      - key: APP_TOKEN
        sync: false                 # sua chave de acesso (frase longa, mín. 16 caracteres)
      - key: FRONTEND_ORIGIN
        value: https://philippin999xz-ai.github.io   # só se ainda usar o GitHub Pages
