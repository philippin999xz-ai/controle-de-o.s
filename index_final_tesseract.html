<style>

<body>
<header>🛠️ Cadastro de Ordem de Serviço<small>Foto → Leitura automática → Conferência → Excel</small></header>
<main id="app"></main>
<nav id="nav"></nav>

<script>
const CAMPOS=[["numero_os","Número da Ordem"],["equipamento","Equipamento"],["servico_solicitado","Serviço solicitado"],["executante","Executante"],["tipo_manutencao","Tipo de manutenção"],["observacoes","Observação"]];
const LONG=["servico_solicitado","observacoes"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tab="nova", rec=[], draft=null, photo=null, msg="", busy=false, ia=false, caps=null;

// ---- armazenamento (registros em localStorage, fotos em IndexedDB) ----
try{rec=JSON.parse(localStorage.getItem("os_regs")||"[]")}catch(e){rec=[]}
const salvarRegs=()=>{try{localStorage.setItem("os_regs",JSON.stringify(rec))}catch(e){msg="Falha ao salvar localmente."}};
let db=null;
const dbReady=new Promise(r=>{try{const q=indexedDB.open("os_fotos",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const fotoPut=async(id,b)=>{await dbReady;if(!db)return;return new Promise(r=>{try{const t=db.transaction("f","readwrite");t.objectStore("f").put(b,id);t.oncomplete=r;t.onerror=r}catch(e){r()}})};
const fotoGet=async id=>{await dbReady;if(!db)return null;return new Promise(r=>{try{const q=db.transaction("f").objectStore("f").get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})};
const fotoDel=async id=>{await dbReady;if(!db)return;try{db.transaction("f","readwrite").objectStore("f").delete(id)}catch(e){}};

// ---- IA (Google Gemini, chave guardada só neste aparelho) ----
const MODEL="gemini-3.8-flash";
const getKey=()=>{try{return localStorage.getItem("gem_key")||""}catch(e){return ""}};
function configurarChave(){const k=prompt("Cole sua chave da API do Google AI Studio (fica só neste aparelho):",getKey());if(k!==null){try{localStorage.setItem("gem_key",k.trim())}catch(e){}ia=!!k.trim();render()}}
async function gem(parts,json){
  const key=getKey();
  if(!key)throw new Error("Chave da API não configurada");

  // Gemini 3.8: usamos a Interactions API, que aceita texto + imagem
  // no mesmo input e é a API recomendada pelo Google para os modelos atuais.
  const input=parts.map(part=>{
    if(part.inline_data){
      return {
        type:"image",
        mime_type:part.inline_data.mime_type||"image/jpeg",
        data:part.inline_data.data
      };
    }
    return {
      type:"text",
      text:part.text||""
    };
  });

  const body={
    model:MODEL,
    input
  };

  // Para a leitura da OS, pedimos JSON no próprio texto do prompt.
  // Não usamos responseMimeType/temperature, pois o Gemini 3.8 tem
  // regras de migração diferentes dos modelos antigos.
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/interactions",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-goog-api-key":key
    },
    body:JSON.stringify(body)
  });

  let j={};
  try{j=await r.json()}catch(e){}

  if(!r.ok){
    const detalhe=j?.error?.message||("HTTP "+r.status);
    throw new Error(detalhe);
  }

  // A API retorna output_text em respostas concluídas.
  if(j.output_text) return j.output_text;

  // Fallback para diferentes formatos de resposta.
  const textos=[];
  for(const step of (j.steps||[])){
    if(step.type==="text" && step.text) textos.push(step.text);
    if(step.output_text) textos.push(step.output_text);
    if(step.content?.parts){
      for(const part of step.content.parts){
        if(part.text) textos.push(part.text);
      }
    }
  }

  const texto=textos.join("\n").trim();
  if(!texto)throw new Error("O Gemini recebeu a imagem, mas não retornou uma resposta.");
  return texto;
}
ia=!!getKey();
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(b)});

function reduzir(file,max=1600){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.8)};img.onerror=rej;img.src=u})}


let ocrWorker=null;

async function obterOCRWorker(){
  if(ocrWorker)return ocrWorker;
  ocrWorker=await Tesseract.createWorker("por", 1, {
    logger:m=>{
      if(m && typeof m.progress==="number"){
        const pct=Math.round(m.progress*100);
        msg=`🔎 Lendo a foto localmente... ${pct}%`;
        render();
      }
    }
  });
  return ocrWorker;
}

function normalizarOCR(t){
  return (t||"")
    .replace(/\r/g,"")
    .replace(/[ \t]+/g," ")
    .replace(/\n{3,}/g,"\n\n")
    .trim();
}

function pegarCampoOCR(texto, nomes){
  const linhas=texto.split("\n").map(x=>x.trim()).filter(Boolean);
  const alvo=nomes.map(n=>n.toLowerCase());
  for(let i=0;i<linhas.length;i++){
    const l=linhas[i];
    const low=l.toLowerCase();
    const achou=alvo.find(n=>low.includes(n));
    if(!achou)continue;
    let resto=l.slice(low.indexOf(achou)+achou.length).replace(/^[\s:;\-–—]+/,"").trim();
    if(resto)return resto;
    if(linhas[i+1])return linhas[i+1].trim();
  }
  return "";
}

function extrairCamposOCR(texto){
  const t=normalizarOCR(texto);
  const dados={
    numero_os: pegarCampoOCR(t,["número da ordem","numero da ordem","nº da ordem","n° da ordem","ordem de serviço","nº os","numero os","número os"]),
    equipamento: pegarCampoOCR(t,["equipamento","máquina","maquina"]),
    servico_solicitado: pegarCampoOCR(t,["serviço solicitado","servico solicitado","serviço","servico"]),
    executante: pegarCampoOCR(t,["executante","responsável","responsavel"]),
    tipo_manutencao: pegarCampoOCR(t,["tipo de manutenção","tipo de manutencao","tipo manutenção","tipo manutencao"]),
    observacoes: pegarCampoOCR(t,["observação","observacoes","observação/observações","observações"])
  };

  // Heurística extra para OS: captura códigos/números próximos a rótulos comuns.
  if(!dados.numero_os){
    const m=t.match(/(?:OS|O\.S\.|ORDEM(?:\s+DE\s+SERVIÇO)?)\s*[:#№nº\-]?\s*(\d{2,})/i);
    if(m)dados.numero_os=m[1];
  }

  const incertos=[];
  Object.keys(dados).forEach(k=>{if(!dados[k])incertos.push(k)});
  return {...dados,incertos,ocr_texto:t};
}

async function processarOCR(){
  if(busy)return;
  if(!photo){
    msg="📷 Primeiro tire uma foto ou escolha uma imagem da galeria/arquivos.";
    render();
    return;
  }

  busy=true;
  msg="🔎 Etapa 1/2: OCR local lendo a imagem...";
  render();

  let texto="";
  try{
    const worker=await obterOCRWorker();
    const result=await worker.recognize(photo.blob);
    texto=normalizarOCR(result?.data?.text||"");
    if(!texto)throw new Error("não foi encontrado texto legível na imagem");

    // OCR é sempre a etapa padrão e já fica disponível localmente.
    draft={...extrairCamposOCR(texto),ocr_texto:texto};

    // Sem chave: não interrompe o processo. Entrega o resultado do OCR.
    if(!ia){
      msg="✅ OCR local concluído. Nenhuma chave Gemini configurada; os campos encontrados já estão disponíveis para conferência.";
      return;
    }

    // Com chave: tenta automaticamente a segunda etapa.
    msg="🤖 Etapa 2/2: Gemini organizando o texto nos campos da OS...";
    render();

    const prompt=`Você é um organizador de Ordens de Serviço de manutenção industrial.

O OCR local já leu a fotografia. Receba SOMENTE o texto abaixo.
Não peça a imagem e não faça OCR novamente.

Distribua somente nos campos existentes:
numero_os, equipamento, servico_solicitado, executante, tipo_manutencao, observacoes.

REGRAS:
1. Use somente informações presentes no texto.
2. Não invente, complete ou suponha.
3. Se não identificar um campo, deixe "".
4. Preserve números, códigos, nomes e textos.
5. Não crie novos campos, abas ou categorias.
6. Responda SOMENTE com JSON válido, sem markdown.

Formato:
{"numero_os":"","equipamento":"","servico_solicitado":"","executante":"","tipo_manutencao":"","observacoes":"","incertos":[]}

TEXTO DO OCR:
${texto}`;

    try{
      const t=await gem([{text:prompt}],true);
      const limpo=t.replace(/```json/gi,"").replace(/```/g,"").trim();
      const dados=JSON.parse(limpo);
      draft={
        numero_os:dados.numero_os||"",
        equipamento:dados.equipamento||"",
        servico_solicitado:dados.servico_solicitado||"",
        executante:dados.executante||"",
        tipo_manutencao:dados.tipo_manutencao||"",
        observacoes:dados.observacoes||"",
        incertos:Array.isArray(dados.incertos)?dados.incertos:[],
        ocr_texto:texto
      };
      msg="✅ OCR + Gemini concluídos. Confira os campos antes de salvar.";
    }catch(aiError){
      // Falha do Gemini não perde o OCR já realizado.
      console.error(aiError);
      draft={...extrairCamposOCR(texto),ocr_texto:texto};
      msg="⚠️ Gemini não respondeu. O sistema mudou automaticamente para OCR local e manteve os campos lidos para conferência.";
    }
  }catch(e){
    console.error(e);
    msg="❌ Não foi possível ler a imagem com OCR: "+(e.message||"erro desconhecido")+". Você pode preencher os campos manualmente.";
  }finally{
    busy=false;
    render();
  }
}

async function processarOCRSomente(){
  if(busy)return;
  if(!photo){msg="📷 Primeiro tire ou selecione uma foto da Ordem de Serviço.";render();return}
  busy=true;
  msg="🔎 Lendo somente com OCR local...";
  render();
  try{
    const worker=await obterOCRWorker();
    const result=await worker.recognize(photo.blob);
    const texto=normalizarOCR(result?.data?.text||"");
    if(!texto)throw new Error("não foi encontrado texto legível na imagem");
    draft={...extrairCamposOCR(texto),ocr_texto:texto};
    msg="✅ OCR local concluído. Os campos encontrados foram preenchidos; confira e ajuste manualmente.";
  }catch(e){
    msg="❌ OCR local não conseguiu ler a foto: "+(e.message||"erro desconhecido");
  }finally{
    busy=false;render();
  }
}

async function processar(){
  // Mantém o botão antigo funcionando, mas agora usa o fluxo seguro:
  // Tesseract local -> texto -> Gemini -> campos.
  await processarOCR();
}

async function salvar(){
  const o={id:"os_"+Date.now(),criado:new Date().toISOString()};
  CAMPOS.forEach(([k])=>{const v=$("#f_"+k).value.trim();o[k]=v||""});
  if(!o.numero_os&&!o.equipamento){msg="Informe ao menos o número da ordem ou o equipamento.";render();return}
  if(photo)await fotoPut(o.id,photo.blob);
  o.foto=!!photo;rec.unshift(o);salvarRegs();draft=null;photo=null;msg="✅ OS salva no histórico.";tab="hist";render();
}

async function exportar(){
  if(!rec.length){msg="Nada para exportar.";render();return}
  const ws=XLSX.utils.json_to_sheet(rec.map(r=>{const x={};CAMPOS.forEach(([k,l])=>x[l]=r[k]||"");x["Registrado em"]=r.criado;return x}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"OS");
    XLSX.writeFile(wb,"historico_os.xlsx");
}

async function perguntar(){
  const q=$("#q").value.trim();if(!q||!ia)return;busy=true;$("#resp")&&($("#resp").textContent="Analisando...");
  const base=rec.map(({foto,id,criado,...r})=>r);
  const p=`Você é assistente técnico de manutenção/usinagem. Use APENAS o histórico de OS abaixo (JSON). Não invente dados que não estejam nele.
Responda somente com base no histórico de Ordens de Serviço. Quando a pergunta pedir comparação ou relação entre ordens, cite o Número da Ordem usado como evidência. Responda em português, de forma curta.

HISTÓRICO:
${JSON.stringify(base)}

PERGUNTA: ${q}`;
  try{ia_resp=await gem([{text:p}],false)}catch(e){ia_resp="Erro ao consultar ("+(e.message||"falha")+")."}
  busy=false;render();
}
let ia_resp="";

// ---- telas ----
function telaNova(){
  const inc=draft?.incertos||[];
  const dados=draft||{};
  return `<div class="card">
    <b>Nova Ordem de Serviço</b>
    <div class="mut">${esc(msg||"Preencha manualmente ou tire uma foto para leitura automática por OCR local ou Gemini.")}</div>

    <input type="file" id="cam" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="gal" accept="image/*" multiple style="display:none">

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" onclick="$('#cam').click()">📷 TIRAR FOTO</button>
      <button type="button" class="sec" onclick="$('#gal').click()">🖼️ GALERIA / ARQUIVOS</button>
    </div>
    <div class="mut" style="margin-top:8px">
      No celular: use <b>Tirar foto</b> ou escolha imagens da galeria. No computador/web: selecione fotos salvas no aparelho.
    </div>
    ${photo?`<img class="prev" src="${photo.url}" alt="Foto da ordem de serviço">`:""}

    <button type="button" ${(!photo||busy)?"disabled":""} onclick="processarOCR()">
      ${busy?"⏳ PROCESSANDO...":"🤖 LER E PREENCHER AUTOMATICAMENTE"}
    </button>

    <hr style="border:0;border-top:1px solid var(--bd);margin:16px 0">

    <b>Cadastro da Ordem</b>
    <div class="grid">
      ${CAMPOS.map(([k,l])=>`
        <div style="${LONG.includes(k)?"grid-column:1/-1":""}">
          <label>${l}${inc.includes(k)?" ⚠️ conferir":""}</label>
          ${LONG.includes(k)
            ? `<textarea id="f_${k}" class="${inc.includes(k)?"low":""}" placeholder="${l}">${esc(dados[k]||"")}</textarea>`
            : `<input id="f_${k}" class="${inc.includes(k)?"low":""}" value="${esc(dados[k]||"")}" placeholder="${l}">`
          }
        </div>`).join("")}
    </div>

    <button type="button" onclick="salvar()">✅ CONFIRMAR E SALVAR</button>
    ${draft?`<button type="button" class="sec" onclick="draft=null;photo=null;msg='';render()">Limpar / Nova ordem</button>`:""}
  </div>`;
}
function telaPesq(){
  const t=($("#busca")?.value||window._b||"").toLowerCase();window._b=t;
  const r=t?rec.filter(x=>JSON.stringify(x).toLowerCase().includes(t)):[];
  return `<div class="card"><b>🔎 Pesquisa</b><input id="busca" placeholder="Ordem, equipamento, serviço, executante..." value="${esc(t)}" oninput="window._b=this.value;render(true)">
  ${t?(r.length?r.map(linha).join(""):`<p class="mut">Nenhum resultado.</p>`):`<p class="mut">Digite para buscar no histórico.</p>`}</div>`;
}
function telaCompat(){
  const chave=getKey();
  return `<div class="card"><b>⚙️ Compatibilidade</b>
  <div class="mut">Pergunte sobre o histórico e configure a chave usada pelo sistema. A chave fica somente neste aparelho.</div>

  <label>🔑 Chave da API do Google Gemini</label>
  <input id="gemkey" type="password" value="${esc(chave)}" placeholder="Cole aqui sua chave do Google AI Studio">
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
    <button type="button" onclick="salvarChaveCompat()">💾 SALVAR CHAVE</button>
    <button type="button" class="sec" onclick="limparChaveCompat()">🗑️ REMOVER CHAVE</button>
  </div>
  <div class="mut" style="margin-top:8px">
    Status: ${ia?"🟢 chave configurada":"🔴 chave não configurada"}
  </div>

  <hr style="border:0;border-top:1px solid var(--bd);margin:16px 0">

  ${ia?`<textarea id="q" placeholder="Ex.: Quais equipamentos tiveram manutenção?">${esc(window._q||"")}</textarea>
  <button ${busy?"disabled":""} onclick="window._q=$('#q').value;perguntar()">Perguntar ao histórico</button>
  <pre id="resp">${esc(ia_resp)}</pre>`:`<p class="mut">Configure a chave acima para usar o Gemini na organização automática do OCR e nas consultas do histórico.</p>`}

  <div class="mut" style="margin-top:12px">
    📷 Fluxo da leitura: <b>Tesseract (foto → texto)</b> → <b>Gemini (texto → campos)</b>.
    O Gemini não recebe a foto nesse fluxo.
  </div>
  </div>`;
}
function salvarChaveCompat(){
  const k=($("#gemkey")?.value||"").trim();
  try{localStorage.setItem("gem_key",k)}catch(e){}
  ia=!!k;
  msg=ia?"✅ Chave da API atualizada neste aparelho.":"⚠️ Nenhuma chave configurada.";
  render();
}
function limparChaveCompat(){
  try{localStorage.removeItem("gem_key")}catch(e){}
  ia=false;
  msg="🗑️ Chave removida deste aparelho.";
  render();
}

function linha(r){return `<div class="row"><b>Ordem ${esc(r.numero_os||"s/n")}</b> · ${esc(r.equipamento||"—")}<div class="mut"><b>Serviço:</b> ${esc(r.servico_solicitado||"—")}</div><div class="mut"><b>Executante:</b> ${esc(r.executante||"—")} · <b>Manutenção:</b> ${esc(r.tipo_manutencao||"—")}</div><div class="mut"><b>Observação:</b> ${esc(r.observacoes||"—")}</div>${r.foto?`<button class="sec" style="width:auto;padding:6px 10px" onclick="ver('${r.id}')">📎 foto</button> `:""}<button class="sec del" style="width:auto;padding:6px 10px;background:none;color:#c62828;border-color:#c62828" onclick="apagar('${r.id}')">Excluir</button><div id="v_${r.id}"></div></div>`}
function telaHist(){return `<div class="card"><b>📊 Histórico (${rec.length})</b><div class="mut">${esc(msg)}</div>${rec.map(linha).join("")||`<p class="mut">Nenhuma OS ainda.</p>`}<button onclick="exportar()">⬇️ Exportar Excel (.xlsx)</button></div>`}
function telaDash(){
  const uniq=k=>new Set(rec.map(r=>(r[k]||"").trim().toLowerCase()).filter(Boolean)).size;
  const top=k=>{const m={};rec.forEach(r=>{const v=(r[k]||"").trim();if(v)m[v]=(m[v]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5)};
  const lista=(t,k)=>`<div class="card"><b>${t}</b>${top(k).map(([n,c])=>`<div class="row">${esc(n)} <span class="mut">× ${c}</span></div>`).join("")||`<p class="mut">—</p>`}</div>`;
  return `<div class="kpis"><div class="kpi"><b>${rec.length}</b>Ordens</div><div class="kpi"><b>${uniq("equipamento")}</b>Equipamentos</div><div class="kpi"><b>${uniq("executante")}</b>Executantes</div><div class="kpi"><b>${uniq("tipo_manutencao")}</b>Tipos de manutenção</div></div><div style="height:12px"></div>${lista("Equipamentos mais frequentes","equipamento")}${lista("Tipos de manutenção","tipo_manutencao")}${lista("Executantes mais frequentes","executante")}`;
}
async function ver(id){const el=$("#v_"+id);if(el.innerHTML){el.innerHTML="";return}const b=await fotoGet(id);el.innerHTML=b?`<img class="prev" src="${URL.createObjectURL(b)}">`:`<div class="mut">Foto não encontrada.</div>`}
async function apagar(id){if(!confirm("Excluir esta OS?"))return;rec=rec.filter(r=>r.id!==id);await fotoDel(id);salvarRegs();render()}

const TABS=[["nova","📷","Nova OS"],["pesq","🔎","Pesquisa"],["compat","⚙️","Compat."],["hist","📊","Histórico"],["dash","📈","Dashboard"]];
function render(keep){
  const a=$("#app"),foc=document.activeElement?.id,pos=document.activeElement?.selectionStart;
  a.innerHTML={nova:telaNova,pesq:telaPesq,compat:telaCompat,hist:telaHist,dash:telaDash}[tab]();
  $("#nav").innerHTML=TABS.map(([k,i,l])=>`<a class="${k===tab?"on":""}" onclick="tab='${k}';msg='';render()"><b>${i}</b>${l}</a>`).join("");
  const tratarArquivos=async files=>{
    const lista=Array.from(files||[]).filter(f=>f.type&&f.type.startsWith("image/"));
    if(!lista.length)return;
    const f=lista[0];
    try{
      msg="📷 Preparando a imagem...";
      render();
      const blob=await reduzir(f);
      if(photo?.url)try{URL.revokeObjectURL(photo.url)}catch(x){}
      photo={blob,url:URL.createObjectURL(blob),nome:f.name};
      msg=`✅ Imagem pronta: ${f.name||"foto"}. Toque em LER E PREENCHER AUTOMATICAMENTE.`;
      render();
    }catch(x){
      console.error(x);
      msg="❌ Não consegui abrir essa imagem. Tente selecionar outra foto.";
      render();
    }
  };
  const c=$("#cam");
  const g=$("#gal");
  if(c)c.onchange=async e=>{await tratarArquivos(e.target.files);c.value=""};
  if(g)g.onchange=async e=>{await tratarArquivos(e.target.files);g.value=""};
  if(keep&&foc){const e=document.getElementById(foc);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
}
render();
</script>
</body>
