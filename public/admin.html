<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Painel Administrativo — Gestão de OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="core.js"></script>
<style>
:root{--bg:#000;--card:#0e0e0e;--tx:#fff;--mut:#a6a6a6;--pri:#ffff00;--onpri:#000;--pribg:rgba(255,255,0,.14);--navbg:#000;--bd:#3d3d3d;--line:#b7b7b7;--warn:#ff9800;--ok:#00b050;--bad:#ff0000;--c1:#ffff00;--c2:#0070c0;--c3:#00b050;--c4:#b1a0c7;--c5:#ff0000;--c6:#a6a6a6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f2f2f2;--card:#fff;--tx:#000;--mut:#5c5c5c;--pri:#000;--onpri:#ffff00;--pribg:rgba(0,0,0,.08);--navbg:#fff;--bd:#d0d0d0;--line:#000;--warn:#e65100;--bad:#d50000;--c1:#d4b200;color-scheme:light}
:root[data-theme="light"] header img{filter:invert(1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:78px}
header{padding:14px 16px 12px;font-weight:700;font-size:17px;border-bottom:1px solid var(--line);margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:34px;width:auto;display:block}
header .t{flex:1;min-width:180px}
header small{display:block;font-weight:400;color:var(--mut);font-size:12px}
header a,.lnk{color:var(--pri);font-size:12px;text-decoration:underline;margin-left:8px;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:var(--pri);color:var(--onpri);font-weight:600;width:100%;margin-top:8px;cursor:pointer}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.del{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button.s{width:auto;padding:6px 10px;margin:0;font-size:13px}
button.tema{width:auto;margin:0;padding:8px 12px;background:transparent;color:var(--tx);border:1px solid var(--line);font-size:16px;line-height:1}
button:disabled{opacity:.5;cursor:default}
label{display:block;font-size:12px;color:var(--mut);margin-top:10px}
input,textarea,select{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input[type=checkbox]{width:auto}
textarea{min-height:70px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--navbg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:10px 0;font-size:11px;color:var(--mut);cursor:pointer}
nav a.on{color:var(--pri);font-weight:700}
nav a b{display:block;font-size:20px}
img.prev{width:100%;max-width:520px;border-radius:10px;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center;font-size:13px;color:var(--mut)}
.kpi b{display:block;font-size:26px;color:var(--pri)}
.row{border-bottom:1px solid var(--bd);padding:10px 0}
.row:last-child{border:0}
.mut{color:var(--mut);font-size:13px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--pribg);color:var(--pri);margin-left:6px;vertical-align:middle}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.inline select{width:auto;min-width:140px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--tx);margin:6px 0}
.permgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 12px;margin-top:6px}
.err{color:var(--bad);font-size:13px;margin-top:8px}
/* gráficos */
.bar{display:grid;grid-template-columns:minmax(80px,38%) 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar .tr{background:var(--bd);border-radius:6px;height:14px;overflow:hidden}
.bar .fl{height:100%;background:var(--c1);border-radius:6px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .vl{text-align:right;font-weight:700}
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:18px}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}
.cols .c i{display:block;width:100%;background:var(--c1);border-radius:5px 5px 0 0;min-height:2px}
.cols .c span{color:var(--tx);font-weight:700;margin-bottom:2px}
.donutw{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.leg{font-size:13px;flex:1;min-width:150px}
.leg div{display:flex;align-items:center;gap:8px;margin:4px 0}
.leg i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
h3{margin:0 0 6px;font-size:15px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px}
.md{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;width:100%;max-width:560px}
</style>
<link rel="stylesheet" href="admin-shell.css">
</head>
<body>
<header><img alt="Açoforja" src="logo.png"><div class="t">Painel Administrativo<small>Usuários · Cargos · OS · Dashboard</small></div><span id="uinfo" class="mut"></span><button type="button" class="tema" id="tema" onclick="Core.alternarTema()" aria-label="Alternar tema claro/escuro"></button></header>
<main id="app"></main>
<nav id="nav"></nav>

<script>
Core.iniciarTema();
const $=s=>document.querySelector(s);
const esc=Core.esc;
const CAMPOS=[["numero_os","Número da Ordem"],["equipamento","Equipamento"],["servico_solicitado","Serviço solicitado"],["executante","Executante"],["tipo_manutencao","Tipo de manutenção"],["observacoes","Observação"]];
const LONG=["servico_solicitado","observacoes"];
let tab="dash",msg="",loginMsg="",setupMsg="",edit=null,pinTarget=null;
let F={de:"",ate:"",equip:"",exec:"",tipo:"",user:"",q:""};

/* ---------- utilidades ---------- */
const norm=s=>String(s||"").trim().toLowerCase();
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const splitExec=s=>String(s||"").split(/[,;\n]| e /i).map(x=>x.trim()).filter(Boolean);
const SEM_USER="(sem usuário)";
function dataLocal(r){const d=new Date(r.criado);if(isNaN(d))return "";return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function contar(valores){
  const m=new Map();
  valores.forEach(v=>{const k=norm(v);if(!k)return;const o=m.get(k)||{nome:cap(String(v).trim()),n:0};o.n++;m.set(k,o)});
  return [...m.values()].sort((a,b)=>b.n-a.n||a.nome.localeCompare(b.nome));
}
function filtrar(lista,comBusca){
  return lista.filter(r=>{
    const d=dataLocal(r);
    if(F.de&&(!d||d<F.de))return false;
    if(F.ate&&(!d||d>F.ate))return false;
    if(F.equip&&norm(r.equipamento)!==F.equip)return false;
    if(F.exec&&!splitExec(r.executante).map(norm).includes(F.exec))return false;
    if(F.tipo&&norm(r.tipo_manutencao)!==F.tipo)return false;
    if(F.user&&(r.usuario||SEM_USER)!==F.user)return false;
    if(comBusca&&F.q&&!JSON.stringify(r).toLowerCase().includes(F.q.toLowerCase()))return false;
    return true;
  });
}
const opcoes=(lista,sel)=>`<option value="">Todos</option>`+lista.map(o=>`<option value="${esc(norm(o.nome))}" ${norm(o.nome)===sel?"selected":""}>${esc(o.nome)}</option>`).join("");
function barraFiltros(all,comBusca){
  const eq=contar(all.map(r=>r.equipamento)),ex=contar(all.flatMap(r=>splitExec(r.executante))),ti=contar(all.map(r=>r.tipo_manutencao));
  const us=[...new Set(all.map(r=>r.usuario||SEM_USER))].sort();
  return `<div class="card"><b>Filtros</b>
   <div class="grid">
    <div><label>De</label><input type="date" value="${esc(F.de)}" onchange="F.de=this.value;render()"></div>
    <div><label>Até</label><input type="date" value="${esc(F.ate)}" onchange="F.ate=this.value;render()"></div>
    <div><label>Equipamento</label><select onchange="F.equip=this.value;render()">${opcoes(eq,F.equip)}</select></div>
    <div><label>Executante</label><select onchange="F.exec=this.value;render()">${opcoes(ex,F.exec)}</select></div>
    <div><label>Tipo de manutenção</label><select onchange="F.tipo=this.value;render()">${opcoes(ti,F.tipo)}</select></div>
    <div><label>Registrado por</label><select onchange="F.user=this.value;render()"><option value="">Todos</option>${us.map(u=>`<option value="${esc(u)}" ${u===F.user?"selected":""}>${esc(u)}</option>`).join("")}</select></div>
   </div>
   ${comBusca?`<label for="busca">Busca</label><input id="busca" placeholder="Ordem, equipamento, serviço, executante..." value="${esc(F.q)}" oninput="F.q=this.value;render(true)">`:""}
   <button type="button" class="sec s" style="margin-top:10px" onclick="F={de:'',ate:'',equip:'',exec:'',tipo:'',user:'',q:''};render()">Limpar filtros</button>
  </div>`;
}

/* ---------- gráficos (sem bibliotecas) ---------- */
function donut(entries){
  const tot=entries.reduce((a,e)=>a+e.n,0);
  if(!tot)return `<p class="mut">Sem dados.</p>`;
  let list=entries;
  if(list.length>6){const resto=list.slice(5).reduce((a,e)=>a+e.n,0);list=[...list.slice(0,5),{nome:"Outros",n:resto}]}
  let acc=0;
  const segs=list.map((e,i)=>{const p=e.n/tot*100;const s=`<circle r="15.915" cx="21" cy="21" fill="none" stroke="var(--c${i+1})" stroke-width="7" stroke-dasharray="${p.toFixed(3)} ${(100-p).toFixed(3)}" stroke-dashoffset="${(25-acc).toFixed(3)}"/>`;acc+=p;return s}).join("");
  const leg=list.map((e,i)=>`<div><i style="background:var(--c${i+1})"></i><span style="flex:1">${esc(e.nome)}</span><b>${(e.n/tot*100).toFixed(0)}%</b> <span class="mut">(${e.n})</span></div>`).join("");
  return `<div class="donutw"><svg viewBox="0 0 42 42" width="150" height="150" role="img" aria-label="Percentual por tipo">${segs}<text x="21" y="22.5" text-anchor="middle" font-size="7" font-weight="700" fill="var(--tx)">${tot}</text></svg><div class="leg">${leg}</div></div>`;
}
function barrasH(entries,max=8){
  const l=entries.slice(0,max);
  if(!l.length)return `<p class="mut">Sem dados.</p>`;
  const m=Math.max(...l.map(e=>e.n));
  return l.map(e=>`<div class="bar"><span class="nm" title="${esc(e.nome)}">${esc(e.nome)}</span><div class="tr"><div class="fl" style="width:${(e.n/m*100).toFixed(1)}%"></div></div><span class="vl">${e.n}</span></div>`).join("");
}
function colunasMes(L){
  const hoje=new Date(),meses=[];
  for(let i=11;i>=0;i--){const d=new Date(hoje.getFullYear(),hoje.getMonth()-i,1);meses.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))}
  const cont={};meses.forEach(m=>cont[m]=0);
  L.forEach(r=>{const m=dataLocal(r).slice(0,7);if(m in cont)cont[m]++});
  const mx=Math.max(1,...meses.map(m=>cont[m]));
  return `<div class="cols">${meses.map(m=>`<div class="c"><span>${cont[m]||""}</span><i style="height:${(cont[m]/mx*100).toFixed(1)}%"></i>${m.slice(5)}/${m.slice(2,4)}</div>`).join("")}</div>`;
}

/* ---------- telas ---------- */
function telaDash(){
  const all=Core.regs(),L=filtrar(all,false);
  const eq=contar(L.map(r=>r.equipamento)),ex=contar(L.flatMap(r=>splitExec(r.executante))),ti=contar(L.map(r=>r.tipo_manutencao)),us=contar(L.map(r=>r.usuario||SEM_USER));
  const corr=L.filter(r=>/corret/i.test(r.tipo_manutencao||"")).length;
  return barraFiltros(all,false)+`
  <div class="kpis">
    <div class="kpi"><b>${L.length}</b>Ordens</div>
    <div class="kpi"><b>${eq.length}</b>Equipamentos</div>
    <div class="kpi"><b>${ex.length}</b>Executantes</div>
    <div class="kpi"><b>${us.length}</b>Usuários que registraram</div>
    <div class="kpi"><b>${L.length?Math.round(corr/L.length*100):0}%</b>Corretivas</div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Percentual por tipo de manutenção</h3>${donut(ti)}</div>
    <div class="card"><h3>OS por mês (últimos 12)</h3>${colunasMes(L)}</div>
    <div class="card"><h3>Equipamentos com mais OS</h3>${barrasH(eq)}</div>
    <div class="card"><h3>Executantes com mais OS</h3>${barrasH(ex)}</div>
    <div class="card"><h3>Registros por usuário</h3>${barrasH(us)}</div>
  </div>`;
}

function itemOS(r){
  return `<div class="row"><b>Ordem ${esc(r.numero_os||"s/n")}</b> · ${esc(r.equipamento||"—")} ${r.tipo_manutencao?`<span class="badge">${esc(r.tipo_manutencao)}</span>`:""}
   <div class="mut"><b>Serviço:</b> ${esc(r.servico_solicitado||"—")}</div>
   <div class="mut"><b>Executante:</b> ${esc(r.executante||"—")}</div>
   <div class="mut"><b>Observação:</b> ${esc(r.observacoes||"—")}</div>
   <div class="mut">Registrado por ${esc(r.usuario||SEM_USER)} em ${r.criado?esc(new Date(r.criado).toLocaleString("pt-BR")):"—"}${r.editado?` · editado por ${esc(r.editado_por||"?")}`:""}</div>
   <div class="inline"><button class="sec s" onclick="editar('${r.id}')">✏️ Editar</button>${r.foto?`<button class="sec s" onclick="verFoto('${r.id}')">📎 Foto</button>`:""}<button class="del s" onclick="excluirOS('${r.id}')">Excluir</button></div>
   <div id="v_${r.id}"></div></div>`;
}
function telaOS(){
  const all=Core.regs(),L=filtrar(all,true).sort((a,b)=>String(b.criado).localeCompare(String(a.criado)));
  return barraFiltros(all,true)+`<div class="card"><b>Ordens de serviço (${L.length}${L.length!==all.length?" de "+all.length:""})</b>
   <div class="mut">${esc(msg)}</div>
   ${L.slice(0,200).map(itemOS).join("")||`<p class="mut">Nenhuma OS encontrada.</p>`}
   ${L.length>200?`<p class="mut">Mostrando as 200 mais recentes. Use os filtros para refinar.</p>`:""}
   <button onclick="exportarExcel()">⬇️ Exportar Excel (filtro atual)</button></div>`;
}
function modalEdicao(){
  if(pinTarget)return `<dialog id="pin-dialog" class="md" aria-labelledby="pin-title"><form onsubmit="event.preventDefault();salvarNovoPin()" autocomplete="off"><h2 id="pin-title">Redefinir PIN</h2><p class="mut">Novo acesso para ${esc(pinTarget.nome)}</p><label for="new-pin">Novo PIN (4 a 8 números)</label><input id="new-pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" autocomplete="new-password" required><button>Salvar novo PIN</button><button type="button" class="sec" onclick="pinTarget=null;render()">Cancelar</button></form></dialog>`;
  if(!edit)return "";
  return `<div class="ov"><div class="md"><b>Editar OS</b>
   ${CAMPOS.map(([k,l])=>`<label>${l}</label>${LONG.includes(k)?`<textarea id="e_${k}">${esc(edit[k]||"")}</textarea>`:`<input id="e_${k}" value="${esc(edit[k]||"")}">`}`).join("")}
   <button onclick="salvarEdicao()">Salvar alterações</button><button class="sec" onclick="edit=null;render()">Cancelar</button></div></div>`;
}

const nivelDe=nome=>(Core.cargos().find(c=>c.nome===nome)||{nivel:0}).nivel;
function telaUsers(){
  const eu=Core.usuario();
  const us=Core.users().slice().sort((a,b)=>nivelDe(b.cargo)-nivelDe(a.cargo)||a.nome.localeCompare(b.nome));
  const cs=Core.cargos().slice().sort((a,b)=>b.nivel-a.nivel);
  const optCargo=sel=>cs.map(c=>`<option value="${esc(c.nome)}" ${c.nome===sel?"selected":""}>${esc(c.nome)} (nível ${c.nivel})</option>`).join("");
  return `<div class="card"><b>Usuários (${us.length})</b><div class="mut">${esc(msg)}</div>
   ${us.map(u=>{const eu_=u.id===eu.id;return `<div class="row"><b>${esc(u.nome)}</b><span class="badge">${esc(u.cargo)}</span>${eu_?` <span class="mut">(você)</span>`:""}${u.ativo?"":` <span class="mut">· inativo</span>`}
    <div class="inline"><select onchange="mudarCargo('${u.id}',this.value)">${optCargo(u.cargo)}</select>
    <label class="chk" style="margin:0"><input type="checkbox" ${u.ativo?"checked":""} ${eu_?"disabled":""} onchange="alternarAtivo('${u.id}',this.checked)"> Ativo</label>
    <button class="sec s" onclick="redefinirPin('${u.id}')">Redefinir PIN</button>
    <button class="del s" ${eu_?"disabled":""} onclick="excluirUsuario('${u.id}')">Excluir</button></div></div>`}).join("")}
  </div>
  <div class="card"><b>Novo usuário</b>
   <div class="grid"><div><label for="nu_nome">Nome</label><input id="nu_nome" placeholder="Nome do usuário" autocomplete="off"></div>
   <div><label for="nu_cargo">Cargo</label><select id="nu_cargo"><option value="" selected disabled>Selecione um cargo</option>${optCargo("")}</select></div>
   <div><label for="nu_pin">PIN (4 a 8 números)</label><input id="nu_pin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div></div>
   <button onclick="criarUsr()">➕ Criar usuário</button></div>`;
}

function telaCargos(){
  const cs=Core.cargos(),us=Core.users();
  const ord=cs.map((c,i)=>({c,i})).sort((a,b)=>b.c.nivel-a.c.nivel);
  return `<div class="card"><b>Cargos e permissões</b><div class="mut">Quanto maior o nível, maior a senioridade. As mudanças valem na hora. O Administrador sempre tem todas as permissões.</div><div class="mut">${esc(msg)}</div></div>`+
  ord.map(({c,i})=>{const n=us.filter(u=>u.cargo===c.nome).length;return `<div class="card">
   <div class="grid"><div><label>Cargo</label><input value="${esc(c.nome)}" ${c.fixo?"disabled":""} onchange="renomearCargo(${i},this.value)"></div>
   <div><label>Senioridade (nível)</label><input type="number" min="1" max="98" value="${c.nivel}" ${c.fixo?"disabled":""} onchange="setNivel(${i},this.value)"></div></div>
   <div class="mut" style="margin-top:6px">${n} usuário(s) neste cargo${c.fixo?" · cargo fixo":""}</div>
   <div class="permgrid">${Core.PERMS.map(([k,l])=>`<label class="chk"><input type="checkbox" ${c.perms.includes(k)?"checked":""} ${c.fixo?"disabled":""} onchange="setPerm(${i},'${k}',this.checked)"> ${esc(l)}</label>`).join("")}</div>
   ${c.fixo?"":`<button class="del s" style="margin-top:8px" onclick="excluirCargo(${i})">Excluir cargo</button>`}</div>`}).join("")+
  `<div class="card"><b>Novo cargo</b><div class="grid">
   <div><label for="nc_nome">Nome</label><input id="nc_nome" placeholder="Ex.: Líder de turno"></div>
   <div><label for="nc_nivel">Senioridade (nível 1–98)</label><input id="nc_nivel" type="number" min="1" max="98" value="2"></div>
   <div><label for="nc_copia">Copiar permissões de</label><select id="nc_copia"><option value="">Nenhum (só cadastrar e pesquisar)</option>${cs.filter(c=>!c.fixo).map(c=>`<option value="${esc(c.nome)}">${esc(c.nome)}</option>`).join("")}</select></div></div>
   <button onclick="criarCargo()">➕ Criar cargo</button></div>`;
}

function telaConfig(){
  return `<div class="card"><h2>Sincronização / Turso</h2><p class="mut">As credenciais do banco ficam no servidor. Somente a chave de acesso do aplicativo é configurada neste aparelho.</p><label for="cloud-access">Chave de acesso do aplicativo</label><input id="cloud-access" type="password" autocomplete="new-password" placeholder="Digite uma nova chave de acesso"><div class="inline"><button class="s" onclick="salvarNuvem()">Salvar acesso</button><button class="sec s" onclick="testarNuvem()">Verificar conexão</button><button class="sec s" onclick="desligarNuvem()">Desconectar aparelho</button></div><p id="cloud-status" class="mut" role="status">${localStorage.getItem("os_token")?"Acesso configurado neste aparelho.":"Nenhum acesso configurado neste aparelho."}</p></div><div class="card"><b>🤖 IA / Gemini</b>
   <div class="mut">A chave do Gemini não é mais armazenada no navegador. Ela deve existir somente como variável de ambiente no servidor (Render).</div>
   <div class="inline"><button class="s" onclick="testarIA()">🧪 Testar servidor</button><button class="sec s" onclick="removerChave()">🧹 Limpar chave antiga</button></div>
   <div class="mut" id="cfgmsg" style="margin-top:8px">Status: 🔒 chave do Gemini não exposta no front-end.</div></div>
  <div class="card"><b>💾 Backup</b>
   <div class="mut">Baixa todas as OS, usuários (PINs são guardados só como hash) e cargos. As fotos não entram no backup. Ao importar, os dados são mesclados: nada do que existe é apagado.</div>
   <div class="inline"><button class="s" onclick="baixarBackup()">⬇️ Baixar backup</button><button class="sec s" onclick="$('#imp').click()">⬆️ Importar backup</button></div>
   <input type="file" id="imp" accept="application/json,.json" style="display:none" onchange="importarBackup(this.files[0]);this.value=''">
   <div class="mut" id="bkmsg" style="margin-top:8px"></div></div>
  <div class="card"><b>🔒 Sobre a segurança</b>
   <div class="mut">A remoção da chave do front-end elimina a exposição direta da API do Gemini. A autenticação e o armazenamento centralizado de OS ainda dependem da API de backend; o navegador não deve ser considerado autoridade de segurança.</div></div>`;
}
const cfgMsg=t=>{const e=$("#cfgmsg");if(e)e.textContent=t};

/* ---------- login e primeiro acesso ---------- */
function telaSetup(){
  return `<div class="card" style="max-width:460px;margin:0 auto"><b>Primeiro acesso</b>
   <div class="mut">Ainda não existe administrador. Crie o primeiro: ele terá acesso total a este painel.</div>
   <label for="s_nome">Nome</label><input id="s_nome" placeholder="Seu nome" autocomplete="off">
   <label for="s_pin">PIN (4 a 8 números)</label><input id="s_pin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password">
   <label for="s_pin2">Repita o PIN</label><input id="s_pin2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password">
   <div class="err">${esc(setupMsg)}</div>
   <button onclick="criarAdmin()">Criar administrador</button>
   <div class="mut" style="margin-top:10px">Depois de criado, o aplicativo principal passa a pedir login de todos os usuários.</div></div>`;
}
function telaLogin(){
  const admins=Core.users().filter(u=>u.ativo&&Core.permsDoCargo(u.cargo).includes("painel_admin"));
  return `<div class="card" style="max-width:460px;margin:0 auto"><b>Entrar no painel</b>
   <label for="l_user">Usuário</label><select id="l_user" autocomplete="off"><option value="" selected disabled>Selecione seu usuário</option>${admins.map(u=>`<option value="${u.id}">${esc(u.nome)} — ${esc(u.cargo)}</option>`).join("")}</select>
   <label for="l_pin">PIN</label><input id="l_pin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password" onkeydown="if(event.key==='Enter')entrar()">
   <div class="err">${esc(loginMsg)}</div>
   <button onclick="entrar()">Entrar</button>
   <div class="mut" style="margin-top:10px"><a class="lnk" style="margin:0" href="index.html">← Voltar ao aplicativo</a></div></div>`;
}
async function criarAdmin(){
  const nome=$("#s_nome").value,pin=$("#s_pin").value,pin2=$("#s_pin2").value;
  if(pin!==pin2){setupMsg="Os PINs não conferem.";render();return}
  const r=await Core.criarUsuario({nome,cargo:"Administrador",pin});
  if(!r.ok){setupMsg=r.erro;render();return}
  await Core.login(r.user.id,pin);setupMsg="";msg="";render();
}
async function entrar(){
  const id=$("#l_user")?.value,pin=$("#l_pin")?.value||"";
  const r=await Core.login(id,pin);
  loginMsg=r.ok?"":r.erro;
  render();
}
function sair(){Core.logout();loginMsg="";render()}
function atualizarHeader(){
  const el=$("#uinfo"),u=Core.usuario();
  if(el)el.innerHTML=u?`<b>${esc(u.nome)}</b> · ${esc(u.cargo)} <a href="index.html">← App</a> <a onclick="sair()">Sair</a>`:"";
}

/* ---------- ações: OS ---------- */
function editar(id){const r=Core.regs().find(x=>x.id===id);if(!r)return;edit={...r};render()}
function salvarEdicao(){
  const l=Core.regs(),i=l.findIndex(x=>x.id===edit.id);
  if(i<0){edit=null;render();return}
  CAMPOS.forEach(([k])=>{l[i][k]=$("#e_"+k).value.trim()});
  l[i].editado=new Date().toISOString();l[i].editado_por=Core.usuario()?.nome||"";
  Core.saveRegs(l);edit=null;msg="✅ OS atualizada.";render();
}
async function excluirOS(id){
  if(!confirm("Excluir esta OS? Não dá para desfazer."))return;
  Core.saveRegs(Core.regs().filter(r=>r.id!==id));
  await Core.fotoDel(id);msg="🗑️ OS excluída.";render();
}
async function verFoto(id){
  const el=$("#v_"+id);if(!el)return;
  if(el.innerHTML){el.innerHTML="";return}
  const b=await Core.fotoGet(id);
  el.innerHTML=b?`<img class="prev" src="${URL.createObjectURL(b)}" alt="Foto da OS">`:`<div class="mut">Foto não encontrada neste aparelho.</div>`;
}
function exportarExcel(){
  const L=filtrar(Core.regs(),true);
  if(!L.length){msg="Nada para exportar.";render();return}
  const ws=XLSX.utils.json_to_sheet(L.map(r=>{const x={};CAMPOS.forEach(([k,l])=>x[l]=r[k]||"");x["Registrado por"]=r.usuario||"";x["Registrado em"]=r.criado||"";return x}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"OS");
  XLSX.writeFile(wb,"historico_os_admin.xlsx");
}

/* ---------- ações: usuários ---------- */
function mudarCargo(id,cargo){
  const us=Core.users(),u=us.find(x=>x.id===id);if(!u)return;
  if(!Core.permsDoCargo(cargo).includes("painel_admin")&&Core.adminsAtivos(id).length===0){msg="⚠️ É preciso manter pelo menos um administrador ativo.";render();return}
  u.cargo=cargo;Core.saveUsers(us);msg="✅ "+u.nome+" agora é "+cargo+".";render();
}
function alternarAtivo(id,ativo){
  const us=Core.users(),u=us.find(x=>x.id===id);if(!u)return;
  if(!ativo&&Core.permsDoCargo(u.cargo).includes("painel_admin")&&Core.adminsAtivos(id).length===0){msg="⚠️ É preciso manter pelo menos um administrador ativo.";render();return}
  u.ativo=ativo;Core.saveUsers(us);msg=ativo?"✅ "+u.nome+" ativado.":"⏸️ "+u.nome+" desativado.";render();
}
function redefinirPin(id){
  pinTarget=Core.users().find(x=>x.id===id)||null;render();document.getElementById("new-pin")?.focus();
}
async function salvarNovoPin(){
  if(!pinTarget||!Core.can("painel_admin"))return;
  const r=await Core.definirPin(pinTarget.id,$("#new-pin").value);
  if(r.ok){msg="PIN atualizado.";pinTarget=null;render()}else{msg=r.erro;render()}
}
function excluirUsuario(id){
  const us=Core.users(),u=us.find(x=>x.id===id);if(!u)return;
  if(Core.permsDoCargo(u.cargo).includes("painel_admin")&&Core.adminsAtivos(id).length===0){msg="⚠️ É preciso manter pelo menos um administrador ativo.";render();return}
  if(!confirm("Excluir o usuário "+u.nome+"? As OS que ele registrou continuam no histórico."))return;
  Core.saveUsers(us.filter(x=>x.id!==id));msg="🗑️ Usuário excluído.";render();
}
async function criarUsr(){
  const r=await Core.criarUsuario({nome:$("#nu_nome").value,cargo:$("#nu_cargo").value,pin:$("#nu_pin").value});
  msg=r.ok?"✅ Usuário "+r.user.nome+" criado.":"⚠️ "+r.erro;render();
}

/* ---------- ações: cargos ---------- */
function setPerm(i,p,on){
  const cs=Core.cargos(),c=cs[i];if(!c||c.fixo)return;
  const novo=on?[...new Set([...c.perms,p])]:c.perms.filter(x=>x!==p);
  if(p==="painel_admin"&&!on){
    const resta=Core.users().filter(u=>u.ativo&&(u.cargo===c.nome?novo:Core.permsDoCargo(u.cargo)).includes("painel_admin")).length;
    if(!resta){msg="⚠️ É preciso manter pelo menos um administrador ativo.";render();return}
  }
  c.perms=novo;Core.saveCargos(cs);msg="✅ Permissões de "+c.nome+" atualizadas.";render();
}
function renomearCargo(i,nome){
  nome=String(nome||"").trim();const cs=Core.cargos(),c=cs[i];if(!c||c.fixo)return;
  if(!nome||cs.some((x,j)=>j!==i&&x.nome.toLowerCase()===nome.toLowerCase())){msg="⚠️ Nome vazio ou já usado por outro cargo.";render();return}
  const us=Core.users();us.forEach(u=>{if(u.cargo===c.nome)u.cargo=nome});
  c.nome=nome;Core.saveCargos(cs);Core.saveUsers(us);msg="✅ Cargo renomeado.";render();
}
function setNivel(i,v){
  const cs=Core.cargos(),c=cs[i];if(!c||c.fixo)return;
  const n=Math.max(1,Math.min(98,parseInt(v,10)||1));c.nivel=n;Core.saveCargos(cs);msg="✅ Senioridade atualizada.";render();
}
function excluirCargo(i){
  const cs=Core.cargos(),c=cs[i];if(!c||c.fixo)return;
  if(Core.users().some(u=>u.cargo===c.nome)){msg="⚠️ Há usuários neste cargo. Mude o cargo deles antes de excluir.";render();return}
  if(!confirm("Excluir o cargo "+c.nome+"?"))return;
  cs.splice(i,1);Core.saveCargos(cs);msg="🗑️ Cargo excluído.";render();
}
function criarCargo(){
  const nome=($("#nc_nome").value||"").trim(),nivel=Math.max(1,Math.min(98,parseInt($("#nc_nivel").value,10)||1)),copia=$("#nc_copia").value;
  const cs=Core.cargos();
  if(!nome||cs.some(x=>x.nome.toLowerCase()===nome.toLowerCase())){msg="⚠️ Informe um nome que ainda não exista.";render();return}
  const base=copia?(cs.find(x=>x.nome===copia)||{perms:[]}).perms.filter(p=>p!=="painel_admin"):["criar_os","pesquisar"];
  cs.push({nome,nivel,perms:base.slice()});Core.saveCargos(cs);msg="✅ Cargo "+nome+" criado.";render();
}

function cloudStatus(text){const el=document.getElementById("cloud-status");if(el)el.textContent=text}
function salvarNuvem(){
 if(!Core.can("painel_admin"))return;
 const input=document.getElementById("cloud-access"),value=input.value.trim();
 if(value.length<16){cloudStatus("A chave deve ter pelo menos 16 caracteres.");return}
 try{localStorage.setItem("os_token",value);input.value="";cloudStatus("Acesso salvo. Volte ao aplicativo para sincronizar.")}catch{cloudStatus("Não foi possível salvar neste navegador.")}
}
function desligarNuvem(){if(!Core.can("painel_admin"))return;localStorage.removeItem("os_token");document.getElementById("cloud-access").value="";cloudStatus("Aparelho desconectado. Os registros locais foram mantidos.")}
async function testarNuvem(){
 if(!Core.can("painel_admin"))return;
 cloudStatus("Verificando conexão…");
 try{const r=await fetch("/api/health",{cache:"no-store"});if(!r.ok)throw Error();const h=await r.json();cloudStatus(h.sync?"Servidor conectado e sincronização disponível.":"Sincronização indisponível. Confira a configuração do servidor.")}catch{cloudStatus("Não foi possível consultar o servidor.")}
}
/* ---------- ações: configurações ---------- */
async function testarIA(){
  cfgMsg("⏳ Testando servidor de IA...");
  try{
    const r=await fetch("https://controle-de-o-s.onrender.com/api/health",{credentials:"include",cache:"no-store"});
    const j=await r.json().catch(()=>({}));
    if(r.ok)cfgMsg("✅ Backend online"+(j.ai?" · IA configurada no servidor":" · IA ainda não configurada no servidor"));
    else cfgMsg("❌ Backend respondeu HTTP "+r.status);
  }catch(e){cfgMsg("❌ Backend indisponível: "+(e.message||"falha de rede"))}
}
function removerChave(){
  try{localStorage.removeItem("gem_key")}catch(e){}
  cfgMsg("🔒 Não há chave armazenada neste navegador. A chave da IA fica somente no servidor.");
}
function baixarBackup(){
  const d={versao:1,exportado:new Date().toISOString(),os_regs:Core.regs(),os_users:Core.users(),os_cargos:Core.cargos()};
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));
  a.download="backup_os_"+new Date().toISOString().slice(0,10)+".json";a.click();
  const e=$("#bkmsg");if(e)e.textContent="✅ Backup baixado.";
}
async function importarBackup(f){
  const e=$("#bkmsg");if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||!Array.isArray(d.os_regs))throw new Error("arquivo inválido");
    const regs=Core.regs(),ids=new Set(regs.map(r=>r.id));
    let nr=0;d.os_regs.forEach(r=>{if(r&&r.id&&!ids.has(r.id)){regs.push(r);nr++}});Core.saveRegs(regs);
    const us=Core.users(),uid=new Set(us.map(u=>u.id)),nomes=new Set(us.map(u=>u.nome.toLowerCase()));
    let nu=0;(d.os_users||[]).forEach(u=>{if(u&&u.id&&u.hash&&!uid.has(u.id)&&!nomes.has(String(u.nome).toLowerCase())){us.push(u);nu++}});Core.saveUsers(us);
    const cs=Core.cargos(),cn=new Set(cs.map(c=>c.nome));
    let nc=0;(d.os_cargos||[]).forEach(c=>{if(c&&c.nome&&!c.fixo&&!cn.has(c.nome)){cs.push({nome:c.nome,nivel:Math.max(1,Math.min(98,c.nivel||1)),perms:(c.perms||[]).filter(p=>Core.TODAS.includes(p))});nc++}});Core.saveCargos(cs);
    if(e)e.textContent="✅ Importado: "+nr+" OS, "+nu+" usuário(s), "+nc+" cargo(s) novos.";
  }catch(x){if(e)e.textContent="❌ Não consegui importar: "+(x.message||"erro")}
}

/* ---------- navegação ---------- */
const TABS=[["dash","📈","Dashboard"],["os","📋","OS"],["users","👥","Usuários"],["cargos","🎖️","Cargos"],["config","⚙️","Config."]];
function render(keep){
  const a=$("#app"),nav=$("#nav");
  const foc=document.activeElement?.id,pos=document.activeElement?.selectionStart;
  atualizarHeader();
  const semAdmin=Core.users().filter(u=>u.ativo&&Core.permsDoCargo(u.cargo).includes("painel_admin")).length===0;
  document.body.classList.toggle("auth-view",semAdmin||!Core.usuario()||!Core.can("painel_admin"));
  if(semAdmin){a.innerHTML=telaSetup();nav.innerHTML="";return}
  if(!Core.usuario()||!Core.can("painel_admin")){
    if(Core.usuario())Core.logout();
    a.innerHTML=telaLogin();nav.innerHTML="";return;
  }
  a.innerHTML=({dash:telaDash,os:telaOS,users:telaUsers,cargos:telaCargos,config:telaConfig}[tab])()+modalEdicao();
  const pinDialog=document.getElementById("pin-dialog");
  if(pinDialog){pinDialog.showModal();pinDialog.addEventListener("cancel",e=>{e.preventDefault();pinTarget=null;render()})}
  nav.innerHTML=TABS.map(([k,i,l])=>`<a class="${k===tab?"on":""}" onclick="tab='${k}';msg='';render()"><b>${i}</b>${l}</a>`).join("");
  if(keep&&foc){const e=document.getElementById(foc);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}
}
render();
Core.iniciarTema();
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(pinTarget||edit)){pinTarget=null;edit=null;render()}});
</script>
